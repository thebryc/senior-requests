<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BRYC Admin — Senior Requests</title>
<!-- Proxima Nova via BRYC's Adobe Typekit kit -->
<link rel="stylesheet" href="https://use.typekit.net/oyd0hvb.css" />
<style>
  :root{
    --dark-teal:#2a6465;
    --mid-teal:#007f81;
    --bright-teal:#00adad;
    --light-teal:#40bfbb;
    --pale-teal:#b1e1e9;
    --ghost-teal:#d0ecef;
    --forest:#1B4332;
    --warn-bg:#fbe4e1;
    --warn-ink:#a8402f;
    --ink:#1c2b2b;
    --muted:#5b7573;
    --border:#dfeceb;
    --page-bg:#f4faf9;
    --shadow:0 4px 16px rgba(42,100,101,0.1);
    --radius:12px;
    --font:'proxima-nova',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);background:var(--page-bg);color:var(--ink);}
  a{color:var(--mid-teal);}
  button{font-family:inherit;cursor:pointer;}

  #auth-overlay{
    position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--dark-teal),var(--mid-teal));
  }
  .auth-card{background:#fff;border-radius:var(--radius);padding:44px 38px;width:360px;max-width:90vw;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,0.2);}
  .auth-card h1{font-size:19px;color:var(--dark-teal);margin:0 0 6px;}
  .auth-card p{color:var(--muted);font-size:13.5px;margin:0 0 22px;}
  .google-btn{
    display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #d8dfe0;border-radius:8px;
    padding:11px 18px;font-size:14px;font-weight:500;color:#3c4043;width:100%;justify-content:center;
  }
  .google-btn:hover{box-shadow:0 2px 6px rgba(0,0,0,0.15);}
  .auth-error{color:var(--warn-ink);font-size:13px;margin-top:14px;display:none;}
  #access-denied{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--dark-teal),var(--forest));}
  #access-denied .auth-card h1{color:var(--warn-ink);}

  #app{display:none;}
  header.topbar{
    background:linear-gradient(120deg,var(--dark-teal),var(--mid-teal));color:#fff;
    padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  header.topbar h1{font-size:17px;font-weight:700;margin:0;}
  header.topbar .spacer{flex:1;}
  header.topbar .who{font-size:12.5px;color:var(--ghost-teal);}
  header.topbar .signout{font-size:12px;color:#fff;text-decoration:underline;cursor:pointer;margin-left:12px;}

  .controls{
    background:#fff;border-bottom:1px solid var(--border);padding:14px 26px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:10;
  }
  .filter-tab{
    border:1px solid var(--border);background:#fff;color:var(--dark-teal);border-radius:20px;
    padding:7px 14px;font-size:12.5px;font-weight:600;
  }
  .filter-tab.active{background:var(--dark-teal);color:#fff;border-color:var(--dark-teal);}
  .search-input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;width:200px;font-family:inherit;}
  .toggle-row{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-left:auto;}
  .count-note{font-size:12px;color:var(--muted);margin-left:6px;}

  .list{max-width:920px;margin:20px auto;padding:0 20px 60px;}
  .req-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .req-card.fulfilled{opacity:0.7;}
  .req-card-head{padding:14px 18px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
  .req-card-head .rc-name{font-weight:700;font-size:14px;}
  .req-card-head .rc-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .req-badge{
    display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;
    padding:3px 9px;border-radius:20px;background:var(--ghost-teal);color:var(--dark-teal);flex-shrink:0;
  }
  .req-card-head .spacer{flex:1;}
  .fulfilled-pill{font-size:10.5px;font-weight:700;color:var(--forest);background:#e3f3e8;padding:3px 9px;border-radius:20px;}

  .req-card-body{padding:0 18px 16px;border-top:1px solid var(--border);display:none;}
  .req-card.open .req-card-body{display:block;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12.5px;margin:14px 0;}
  .detail-grid .dg-label{color:var(--muted);}
  .detail-grid .dg-value{color:var(--ink);font-weight:600;word-break:break-word;}

  .action-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .action-field{display:flex;flex-direction:column;gap:4px;}
  .action-field label{font-size:11px;font-weight:600;color:var(--dark-teal);}
  .action-field input[type=text],.action-field input[type=number]{
    border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;width:160px;
  }
  .checkbox-field{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;}
  .btn-save{background:var(--mid-teal);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;}
  .btn-save:hover{background:var(--bright-teal);}
  .save-note{font-size:11.5px;color:var(--muted);}

  /* ---------- cohort summary strip ---------- */
  .summary{max-width:920px;margin:20px auto 0;padding:0 20px;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px;}
  .stat .n{font-size:24px;font-weight:700;color:var(--dark-teal);line-height:1.1;}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .stat.alert .n{color:var(--warn-ink);}
  .stat.alert{border-color:#f2cfc9;background:var(--warn-bg);}

  /* ---------- view switcher ---------- */
  .view-switch{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .view-switch button{background:#fff;border:none;padding:7px 15px;font-size:12.5px;font-weight:600;color:var(--dark-teal);}
  .view-switch button.active{background:var(--dark-teal);color:#fff;}

  /* ---------- queue ---------- */
  .queue{max-width:920px;margin:20px auto;padding:0 20px 60px;}
  .qrow{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:10px;padding:12px 16px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .qrow.stale{border-left:4px solid var(--warn-ink);}
  .qrow.roster{opacity:.85;border-style:dashed;}
  .roster-head{max-width:920px;margin:26px 0 10px;font-size:11.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);}
  .qrow .qmain{flex:1 1 220px;min-width:0;}
  .qrow .qname{font-weight:700;font-size:14px;}
  .qrow .qmeta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .over-budget{color:var(--warn-ink);font-weight:700;}
  .qrow .qage{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
    background:var(--ghost-teal);color:var(--dark-teal);white-space:nowrap;}
  .qrow .qage.old{background:var(--warn-bg);color:var(--warn-ink);}
  .qrow input[type=number]{border:1px solid var(--border);border-radius:6px;padding:7px 9px;
    font-size:13px;font-family:inherit;width:96px;}
  .qrow select{border:1px solid var(--border);border-radius:6px;padding:7px 9px;
    font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink);}
  .btn-done{background:var(--bright-teal);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;font-size:13px;font-weight:700;white-space:nowrap;}
  .btn-done:hover{background:var(--mid-teal);}
  .btn-done:disabled{opacity:.5;}
  .qexpand{background:none;border:none;color:var(--mid-teal);font-size:12px;
    text-decoration:underline;padding:4px 0;}
  .qdetails{flex:1 1 100%;border-top:1px dashed var(--border);margin-top:4px;padding-top:10px;}

  .action-field select{border:1px solid var(--border);border-radius:6px;padding:7px 9px;
    font-size:13px;font-family:inherit;width:160px;background:#fff;}
  .action-field input.wide{width:280px;}
  .msg-hint{font-size:11px;color:var(--mid-teal);font-weight:600;}

  .empty-state{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;}
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--forest);color:#fff;padding:10px 18px;
    border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.2);display:none;z-index:300;
  }
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="auth-card">
    <h1>BRYC Admin</h1>
    <p>Senior Support Requests — staff sign-in required.</p>
    <button class="google-btn" id="signin-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.8.54-1.84.86-3.05.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.34C2.38 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.69c-.18-.54-.28-1.11-.28-1.69s.1-1.15.28-1.69V4.97H.9A8.97 8.97 0 000 9c0 1.45.35 2.83.9 4.03l3.05-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.38 2.02.9 4.97l3.05 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="access-denied">
  <div class="auth-card">
    <h1>Access Restricted</h1>
    <p>This admin view is restricted to authorized BRYC staff accounts.</p>
    <button class="google-btn" id="denied-back-btn" style="justify-content:center;">Back to Sign In</button>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <h1>BRYC Admin — Senior Requests</h1>
    <div class="spacer"></div>
    <div class="who" id="who-label"></div>
    <span class="signout" id="signout-btn">Sign out</span>
  </header>

  <div class="controls" id="filter-tabs"><!-- rendered by JS --></div>

  <div class="controls" style="border-top:none;">
    <div class="view-switch">
      <button id="view-queue" class="active">Queue</button>
      <button id="view-all">All requests</button>
    </div>
    <input class="search-input" id="search-input" type="text" placeholder="Search by name…" />
    <label class="toggle-row" style="margin-left:0;"><input type="checkbox" id="email-students" checked /> Email students on changes</label>
    <label class="toggle-row" id="mine-only-wrap" style="display:none;margin-left:0;"><input type="checkbox" id="mine-only" checked /> <span id="mine-only-label">Only my students</span></label>
    <label class="toggle-row"><input type="checkbox" id="unfulfilled-only" checked /> Show unfulfilled only</label>
    <span class="count-note" id="count-note"></span>
    <button id="export-btn" class="filter-tab" style="margin-left:auto;">Export funds usage (CSV)</button>
  </div>

  <div class="summary" id="summary"><!-- rendered by JS --></div>

  <div class="list" id="list"><!-- rendered by JS --></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<script>
(function(){
"use strict";

/* ===================== CONFIG ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyAdt8M96SuFjEon_qceJs6YHInX2b9ai48",
  authDomain: "senior-team-site.firebaseapp.com",
  projectId: "senior-team-site",

  messagingSenderId: "275601637068",

// hardcoded here. Sign-in is gated on the BRYC domain; the precise per-person

// reach the Google sign-in step.
const ADMIN_EMAIL_DOMAIN = "thebryc.org";


const SHEET_ID = "1J56K1q9DrIUC4YiLx_5R9vC3e2uq2KExcl6t1-0VhKw";  // PY27_BRYC Senior Request Form Tracker
const SHEET_NAME = "Form Responses";        // raw Google Form submissions
const FEE_BALANCE_SHEET = "Fee Payment Balance";
const SHEETS_SCOPE = "https://www.googleapis.com/auth/spreadsheets";

// $150 for the academic year, the same for every fellow. This OVERRIDES the
// Fee Payment Balance tab, whose Starting Balance column (and therefore its
// Current Balance formula) still reads $100 from last year -- honouring the
// sheet would show everyone $50 short. Balances here are computed as
// $150 + Additional Funds - payments.
const DEFAULT_STARTING_FUNDS = 150;

// Same deployed Apps Script Web App URL as the portal. Used only to email a
// student after you save; the script verifies your Google identity first.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymyYS88tLegXCZaqif2yakqOO62_RtU4bfC9DYrHcMR9f1Pxf9FU0gJlclYU7YAyYn/exec";

// Tracking columns this dashboard owns and creates, appended after whatever
// columns the form itself produced. Must match STAGE_COLUMNS in the Apps Script.
const TRACKING_COLUMNS = ["Fulfilled", "Notes", "Stage", "Message to Student"];
const STAGES = ["Received", "In review", "Approved", "Complete"];
const STALE_DAYS = 7;

// The weekly attendance workbook, used here as the Fellow ROSTER: anyone on it
// is a current senior, whether or not they've ever submitted a request. Same
// ids as the Apps Script -- keep them in step.
const ATTENDANCE_SHEET_ID = "13j0yKuyPdOx_zdQgzyegD0yiAiuu3BQEVtKEWlJ20yU";
const ATTENDANCE_TAB = "Grade 12";
const ATTENDANCE_HEADER_ROW = 5;   // 1-based; data starts on row 6

// Exact option strings the PY27 form writes.
const ROLE_ADVISEE = "I am an Advisee";
const TYPE_SENIOR_FUNDS = "I am requesting to use my senior funds";

/* ---------------------------------------------------------------------------

 * already changed once between program years. Each spec claims the leftmost
 * header not yet claimed, in form order, so the repeated headers

 * `safe` marks what a student may see; everything else is withheld, including

const RESPONSE_FIELDS = [

  { k:"capWho",          m:"choose which one best applies to you",         label:"CAP: requested by", safe:true },
  { k:"guardianName",    m:"guardian first and last name",                 label:"Guardian name", safe:true },
  { k:"capHighSchool",   m:"student high school",                          label:"High school", safe:true },
  { k:"capCounselor",    m:"school counselor's full name",                 label:"School counselor", safe:true },
  { k:"cert1",           eq:"certification",                               label:"Certification", safe:true },

  { k:"writingProject",  m:"which writing project",                        label:"Writing project", safe:true },

  { k:"loginPageUrl",    m:"login page: copy and paste the url",           label:"Login page" },

  { k:"appFeeDeadline",  m:"when is the deadline for the fee to be paid",  label:"Fee deadline", safe:true },
  { k:"actTestDate",     m:"date of the test you are requesting to take",  label:"ACT test date", safe:true },

/**
 * Signed-in email -> the counselor label stored on each response, worked out at
 * run time from the labels actually present in the sheet. Matches the part
 * before the @ against the first name in the label, so a first-name address
 * finds "Ms. Firstname (counselor)". Keeps staff addresses out of this public file.
 */
function counselorLabelFor(email){
  const first = String(email || "").split("@")[0].trim().toLowerCase();
  if(!first) return null;
  const labels = [...new Set(responses.map(function(r){ return String(r.counselor || "").trim(); }).filter(Boolean))];
  for(let i = 0; i < labels.length; i++){
    const m = labels[i].match(/^(?:Ms\.|Mr\.|Mrs\.|Dr\.)?\s*([A-Za-z]+)/);
    if(m && m[1].toLowerCase() === first) return labels[i];
  }
  return null;
}

const FILTERS = [

  { key: "partner_waiver", label: "Partner Waiver" }
];

let responses = [];       // parsed rows from "Form Responses"

let activeFilter = "all";
let searchTerm = "";

let openRowIndex = null;
let viewMode = "queue";
let emailStudents = true;
let mineOnly = false;

let rosterOnly = [];         // ...who have never submitted a request

function escapeHtml(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ t.style.display = "none"; }, 3200);
}
function normHeader(h){
  return String(h == null ? "" : h).replace(/\s+/g, " ").trim().toLowerCase();
}
/** Normalizes a person's name for comparison: no punctuation, no Jr/Sr/III. */
function nameKey(s){
  return String(s || "").toLowerCase()
    .replace(/[.,'`\u2019-]/g, " ")
    .replace(/\b(jr|sr|ii|iii|iv)\b/g, " ")
    .replace(/\s+/g, " ").trim();
}

/** headers -> { key: index }, claiming left to right in RESPONSE_FIELDS order. */
function resolveColumns(headers){
  const norm = headers.map(normHeader);
  const taken = {}, map = {};
  RESPONSE_FIELDS.forEach(function(f){
    for(let i = 0; i < norm.length; i++){
      if(taken[i] || !norm[i]) continue;
      const hit = f.eq ? (norm[i] === f.eq) : (norm[i].indexOf(f.m) > -1);
      if(!hit) continue;
      taken[i] = true; map[f.k] = i; return;
    }
  });
  TRACKING_COLUMNS.forEach(function(name){
    const i = norm.indexOf(name.toLowerCase());
    if(i > -1) map["_" + name.replace(/\s+/g, "")] = i;
  });
  return map;
}

function requestTypeOf(r){
  return r.role === ROLE_ADVISEE ? r.adviseeSupport : r.fellowSupport;
}
function filterKeyOf(r){
  const t = requestTypeOf(r);
  if(t === TYPE_SENIOR_FUNDS) return "senior_funds";
  if(t === "I am requesting writing coach support") return "writing_coach";
  if(t === "I am requesting College Aid Pro access") return "college_aid_pro";
  if(t === "I am requesting a UWorld account") return "uworld";
  if(t === "I am requesting a MasteryPrep login for ACT support") return "masteryprep";
  if(t === "I am requesting a college application fee waiver for a BRYC partner school") return "partner_waiver";
  return "other";
}
/** True when BRYC actually pays money for this request. */
function isFeeBearing(r){
  return requestTypeOf(r) === TYPE_SENIOR_FUNDS && !!r.feeType;
}
function defaultAmountFor(r){
  if(r.feeType === "College application fee" || r.feeType === "CSS Profile (additional school)") return r.appFeeAmount || "";
  if(r.feeType === "College deposit") return r.depositAmount || "";
  return "";
}
/** The label written into the Type of Fee cell; the senior reads this too. */
function defaultDescriptionFor(r){
  if(r.feeType === "College application fee" || r.feeType === "CSS Profile (additional school)"){
    return r.feeType + (r.college ? " - " + r.college : "");
  }
  if(r.feeType === "Registering for the ACT") return "ACT Registration" + (r.actTestDate ? " - " + r.actTestDate : "");
  if(r.feeType === "ACT score report fee") return "ACT Score Report";
  if(r.feeType === "College deposit"){
    const kind = r.depositType ? r.depositType + " deposit" : "College deposit";
    return kind + (r.college ? " - " + r.college : "");
  }
  if(r.feeType === "Other") return "Other: " + (r.feeOther || "");
  return r.feeType || "Senior funds";
}

/** The date money is actually needed by, if this request has one. */
function deadlineOf(r){
  const raw = r.appFeeDeadline || r.depositDueDate || r.actTestDate || "";
  if(!raw) return null;
  const d = new Date(raw);
  return isNaN(d.getTime()) ? null : d;
}
function daysUntilDeadline(r){
  const d = deadlineOf(r);
  return d ? Math.ceil((d.getTime() - Date.now()) / 86400000) : null;
}
function ageInDays(r){
  const t = new Date(r.timestamp);
  return isNaN(t.getTime()) ? null : Math.floor((Date.now() - t.getTime()) / 86400000);
}

function money(v){
  if(v === "" || v === null || v === undefined) return null;
  if(typeof v === "number") return v;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? null : n;
}

/* ===================== AUTH ===================== */
function initFirebase(){
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
}
function doSignIn(){
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope(SHEETS_SCOPE);
  provider.setCustomParameters({ prompt: "select_account" });
  document.getElementById("auth-error").style.display = "none";
  auth.signInWithPopup(provider).then(function(result){
    const email = (result.user.email || "").toLowerCase();
    if(!email.endsWith("@" + ADMIN_EMAIL_DOMAIN)){
      auth.signOut();
      showAccessDenied();
      return;
    }
    const cred = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
    accessToken = cred && cred.accessToken;
    userEmail = email;
    onSignedIn();
  }).catch(function(err){
    const box = document.getElementById("auth-error");
    box.textContent = "Sign-in failed: " + (err && err.message ? err.message : "please try again.");
    box.style.display = "block";
  });
}
function showAccessDenied(){
  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("access-denied").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function onSignedIn(){
  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("access-denied").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("who-label").textContent = "Signed in as " + userEmail;

  loadData();   // the counselor default is applied once responses are in
}

/**
 * A counselor lands on their own students; staff without a counselor label
 * (Jakia, Aareena) land on everybody. Only a default -- the toggle is right there.
 */
function applyCounselorDefault(){
  const label = counselorLabelFor(userEmail);
  mineOnly = !!label;
  const wrap = document.getElementById("mine-only-wrap");
  if(label){
    wrap.style.display = "flex";
    document.getElementById("mine-only").checked = true;
    document.getElementById("mine-only-label").textContent = "Only " + label.split(" (")[0] + "'s students";
  } else {
    wrap.style.display = "none";
  }
}

/* ===================== SHEETS API ===================== */
function sheetsGet(range){
  return sheetsGetFrom(SHEET_ID, range);
}
/** Same as sheetsGet but against another spreadsheet (the attendance roster). */
function sheetsGetFrom(spreadsheetId, range){
  const url = "https://sheets.googleapis.com/v4/spreadsheets/" + spreadsheetId + "/values/" + encodeURIComponent(range);
  return fetch(url, { headers: { Authorization: "Bearer " + accessToken } }).then(function(res){
    if(!res.ok) return res.json().then(function(b){ throw new Error(b.error && b.error.message ? b.error.message : ("HTTP " + res.status)); });
    return res.json().then(function(b){ return b.values || []; });
  });
}
function sheetsUpdate(range, values){
  const url = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "/values/" + encodeURIComponent(range) + "?valueInputOption=USER_ENTERED";
  return fetch(url, {
    method: "PUT",
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
    body: JSON.stringify({ values: values })
  }).then(function(res){
    if(!res.ok) return res.json().then(function(b){ throw new Error(b.error && b.error.message ? b.error.message : ("HTTP " + res.status)); });
    return res.json();
  });
}

/** 0-based column index -> A1 letters (handles AA, AB, ...). */
function colLetter(i){
  let s = "", n = i;
  while(n >= 0){ s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; }
  return s;
}

/**
 * Fire-and-forget call into the Apps Script Web App to email a student. The
 * script re-verifies this counselor's Google identity before sending.
 */
function notifyStudent(sheetRow, kind){
  if(!emailStudents) return Promise.resolve(null);
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) return Promise.resolve(null);
  return new Promise(function(resolve){
    const cb = "bryc_notify_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
    const script = document.createElement("script");
    let done = false;
    const cleanup = function(){
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(function(){ if(!done){ done = true; cleanup(); resolve(null); } }, 15000);
    window[cb] = function(res){ if(!done){ done = true; clearTimeout(timer); cleanup(); resolve(res); } };
    script.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?") > -1 ? "&" : "?")
      + "action=notifyStudent&kind=" + encodeURIComponent(kind)
      + "&row=" + encodeURIComponent(sheetRow)
      + "&adminToken=" + encodeURIComponent(accessToken)
      + "&callback=" + cb;
    script.onerror = function(){ if(!done){ done = true; clearTimeout(timer); cleanup(); resolve(null); } };
    document.body.appendChild(script);
  });
}

/* ===================== FEE PAYMENT BALANCE ===================== */
/**
 * One row per fellow: fixed columns, then repeating
 * [Type of Fee | Amount | Date Paid] triplets running rightwards.
 * "Current Balance" is BRYC's own formula -- read, never written.
 */
function parseFeeLayout(headers){
  const norm = headers.map(normHeader);
  const layout = {
    name: norm.indexOf("fellow name"),
    email: norm.indexOf("email"),
    starting: norm.indexOf("starting balance"),
    additional: norm.indexOf("additional funds"),
    total: norm.indexOf("total"),
    current: norm.indexOf("current balance"),
    width: headers.length,
    triplets: []
  };
  for(let i = 0; i < norm.length; i++){
    if(norm[i] !== "type of fee") continue;
    layout.triplets.push({
      type: i,
      amount: norm[i+1] === "amount" ? i+1 : -1,
      date: norm[i+2] === "date paid" ? i+2 : -1
    });
  }
  return layout;
}

function parseFeeRows(rows){
  if(!rows || rows.length < 2){ feeLayout = rows && rows.length ? parseFeeLayout(rows[0]) : null; return []; }
  feeLayout = parseFeeLayout(rows[0]);
  if(feeLayout.name === -1) return [];
  return rows.slice(1).map(function(row, i){
    const sheetStarting = money(row[feeLayout.starting]);   // stale $100; kept only to warn
    const additional = feeLayout.additional > -1 ? (money(row[feeLayout.additional]) || 0) : 0;
    let spent = 0, used = 0;
    feeLayout.triplets.forEach(function(t){
      const amt = t.amount > -1 ? money(row[t.amount]) : null;
      const type = String(row[t.type] || "").trim();
      if(type || amt !== null){ used++; if(amt !== null) spent += amt; }
    });
    const start = DEFAULT_STARTING_FUNDS + additional;
    return {
      sheetRow: i + 2,
      name: String(row[feeLayout.name] || "").trim(),
      email: feeLayout.email > -1 ? String(row[feeLayout.email] || "").trim().toLowerCase() : "",
      startingFunds: start,
      spent: spent,
      remaining: start - spent,
      usedTriplets: used,
      // Flags rows still carrying last year's figure, so it can be surfaced.
      sheetStartingStale: sheetStarting !== null && sheetStarting !== DEFAULT_STARTING_FUNDS
    };
  }).filter(function(f){ return f.name; });
}

/** The Fee Payment Balance row for whoever made this request. */
function feeRowFor(r){
  const email = String(r.email || "").trim().toLowerCase();
  const key = nameKey(r.name);
  return (email && feeRows.find(function(f){ return f.email === email; }))
      || feeRows.find(function(f){ return nameKey(f.name) === key; })
      || null;
}
function remainingFor(r){
  const f = feeRowFor(r);
  return f ? f.remaining : null;
}

/**
 * Adds an "Email" column to Fee Payment Balance if it's missing, then fills in
 * any blank ones by matching Fellow Name against the names on submitted
 * requests. Anything ambiguous is left blank rather than guessed.
 */
function backfillFeeEmails(){
  if(!feeLayout || feeLayout.name === -1) return Promise.resolve(0);

  const ensure = feeLayout.email > -1
    ? Promise.resolve()
    : sheetsUpdate(FEE_BALANCE_SHEET + "!" + colLetter(feeLayout.width) + "1", [["Email"]]).then(function(){
        feeLayout.email = feeLayout.width;
        feeLayout.width += 1;
        feeRows.forEach(function(f){ f.email = ""; });
      });

  return ensure.then(function(){
    // name -> the single email that name maps to; ambiguous names are dropped.
    const byName = {};
    responses.forEach(function(r){
      const k = nameKey(r.name);
      const e = String(r.email || "").trim().toLowerCase();
      if(!k || !e) return;
      if(byName[k] === undefined) byName[k] = e;
      else if(byName[k] !== e) byName[k] = null;   // same name, two emails -> don't guess
    });

    const writes = [];
    feeRows.forEach(function(f){
      if(f.email) return;
      const e = byName[nameKey(f.name)];
      if(!e) return;
      f.email = e;
      writes.push({ range: FEE_BALANCE_SHEET + "!" + colLetter(feeLayout.email) + f.sheetRow, values: [[e]] });
    });
    if(!writes.length) return 0;

    const url = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "/values:batchUpdate";
    return fetch(url, {
      method: "POST",
      headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
      body: JSON.stringify({ valueInputOption: "USER_ENTERED", data: writes })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(b){ throw new Error(b.error && b.error.message ? b.error.message : ("HTTP " + res.status)); });
      return writes.length;
    });
  });
}

/**
 * Records a payment in the fellow's next free triplet. Never overwrites an
 * existing entry and never touches the Current Balance formula.
 */
function logPayment(r, amount, description){
  const f = feeRowFor(r);
  if(!f) return Promise.reject(new Error("No Fee Payment Balance row for " + (r.name || "this fellow") + " — add one, then save again."));
  if(!feeLayout || !feeLayout.triplets.length) return Promise.reject(new Error("Couldn't find the Type of Fee / Amount / Date Paid columns."));

  const slot = feeLayout.triplets[f.usedTriplets];
  if(!slot) return Promise.reject(new Error(f.name + " has used every payment slot on the sheet — add another Type of Fee / Amount / Date Paid group."));
  if(slot.amount === -1 || slot.date === -1) return Promise.reject(new Error("That payment slot is missing its Amount or Date Paid column."));

  const today = new Date();
  const dateStr = (today.getMonth() + 1) + "/" + today.getDate() + "/" + today.getFullYear();
  const range = FEE_BALANCE_SHEET + "!" + colLetter(slot.type) + f.sheetRow + ":" + colLetter(slot.date) + f.sheetRow;

  return sheetsUpdate(range, [[description, amount, dateStr]]).then(function(){
    f.usedTriplets += 1;
    f.spent += amount;
    f.remaining -= amount;
    return f;
  });
}

/* ===================== ROSTER (attendance sheet) ===================== */
/**
 * The attendance tab doubles as the senior roster. Names are split across
 * First Name / Last Name there, while everything else here uses one field.
 */
function parseRoster(rows){
  if(!rows || rows.length < ATTENDANCE_HEADER_ROW) return [];
  const headers = (rows[ATTENDANCE_HEADER_ROW - 1] || []).map(normHeader);
  const firstIdx = headers.indexOf("first name");
  const lastIdx = headers.indexOf("last name");
  const totalIdx = headers.indexOf("total %");
  if(firstIdx === -1 || lastIdx === -1) return [];

  const out = [];
  const seen = new Set();
  for(let r = ATTENDANCE_HEADER_ROW; r < rows.length; r++){
    const row = rows[r] || [];
    const name = String(row[firstIdx] || "").trim() + " " + String(row[lastIdx] || "").trim();
    const key = nameKey(name);
    if(!key || seen.has(key)) continue;
    seen.add(key);
    let pct = totalIdx > -1 ? row[totalIdx] : "";
    if(typeof pct === "string" && pct.indexOf("%") > -1) pct = parseFloat(pct);
    else if(typeof pct === "number" && pct <= 1) pct = pct * 100;
    else pct = (pct === "" || pct === null || pct === undefined) ? null : Number(pct);
    out.push({ name: name.trim(), key: key, percent: (pct === null || isNaN(pct)) ? null : Math.round(pct * 10) / 10 });
  }
  return out;
}

/**
 * Every senior on the roster gets a Fee Payment Balance row, created here so a
 * new Fellow's funds are ready before they ever submit anything.
 *
 * Only Fellow Name / Starting Balance / Email are written. The Total and
 * Current Balance columns are BRYC's own formulas and are deliberately left
 * alone -- the portal computes a correct balance from Starting minus payments
 * when Current Balance is blank, so nothing is wrong in the meantime, but the
 * formulas will want filling down for the sheet itself to look right.
 */
function provisionRosterFunds(){
  if(!feeLayout || feeLayout.name === -1 || !roster.length) return Promise.resolve(0);

  const have = new Set(feeRows.map(function(f){ return nameKey(f.name); }));
  const missing = roster.filter(function(p){ return !have.has(p.key); });
  if(!missing.length) return Promise.resolve(0);

  // Email if we can get it from their own request rows; blank rather than guessed.
  const byName = {};
  responses.forEach(function(r){
    const k = nameKey(r.name), e = String(r.email || "").trim().toLowerCase();
    if(!k || !e) return;
    if(byName[k] === undefined) byName[k] = e;
    else if(byName[k] !== e) byName[k] = null;
  });

  const width = feeLayout.width;
  const rows = missing.map(function(p){
    const row = new Array(width).fill("");
    row[feeLayout.name] = p.name;
    if(feeLayout.starting > -1) row[feeLayout.starting] = DEFAULT_STARTING_FUNDS;
    if(feeLayout.email > -1 && byName[p.key]) row[feeLayout.email] = byName[p.key];
    return row;
  });

  const url = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "/values/"
    + encodeURIComponent(FEE_BALANCE_SHEET + "!A:" + colLetter(width - 1))
    + ":append?valueInputOption=USER_ENTERED";
  return fetch(url, {
    method: "POST",
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
    body: JSON.stringify({ values: rows })
  }).then(function(res){
    if(!res.ok) return res.json().then(function(b){ throw new Error(b.error && b.error.message ? b.error.message : ("HTTP " + res.status)); });
    missing.forEach(function(p){
      feeRows.push({ sheetRow: -1, name: p.name, email: byName[p.key] || "",
                     startingFunds: DEFAULT_STARTING_FUNDS, spent: 0,
                     remaining: DEFAULT_STARTING_FUNDS, usedTriplets: 0 });
    });
    return missing.length;
  });
}

/** Roster seniors who have never submitted a request. */
function computeRosterOnly(){
  const requested = new Set(responses.map(function(r){ return nameKey(r.name); }).filter(Boolean));
  rosterOnly = roster.filter(function(p){ return !requested.has(p.key); }).map(function(p){
    const f = feeRows.find(function(x){ return nameKey(x.name) === p.key; });
    return { rosterOnly: true, name: p.name, key: p.key, percent: p.percent,
             remaining: f ? f.remaining : null, spent: f ? f.spent : null };
  });
}

/* ===================== DATA LOAD ===================== */
function loadData(){
  document.getElementById("list").innerHTML = `<div class="empty-state">Loading responses…</div>`;
  Promise.all([
    sheetsGet(SHEET_NAME + "!A1:BZ"),
    sheetsGet(FEE_BALANCE_SHEET + "!A1:BZ").catch(function(){ return []; }),
    // The attendance workbook doubles as the senior roster.
    sheetsGetFrom(ATTENDANCE_SHEET_ID, ATTENDANCE_TAB + "!A1:BZ").catch(function(){ return []; })
  ]).then(function(results){
    return ensureTrackingColumns(results[0]).then(function(rows){
      colMap = rows.length ? resolveColumns(rows[0]) : {};
      responses = rows.slice(1)
        .map(function(row, i){ return rowToResponse(row, i + 2); })  // header is row 1
        .filter(function(r){ return r.name || r.email; });           // skip blank rows
      feeRows = parseFeeRows(results[1]);
      roster = parseRoster(results[2]);
      computeRosterOnly();
      applyCounselorDefault();

      renderFilterTabs();
      render();

      // Give every senior on the roster a funds row, then fill in the Email
      // column so a signed-in senior resolves to their row exactly.
      return provisionRosterFunds().then(function(added){
        if(added){
          showToast("Added " + added + " fellow" + (added === 1 ? "" : "s") + " from the attendance roster to Fee Payment Balance. "
            + "Fill the Total / Current Balance formulas down to the new rows.");
        }
        return backfillFeeEmails();
      }).then(function(n){
        if(n) showToast("Filled in " + n + " email" + (n === 1 ? "" : "s") + " on Fee Payment Balance.");
        computeRosterOnly();
        render();
      }).catch(function(err){
        showToast("Roster sync: " + err.message);
      });
    });
  }).catch(function(err){
    document.getElementById("list").innerHTML =
      `<div class="empty-state">Couldn't load data: ${escapeHtml(err.message)}<br/>` +
      `Check that the tabs are named "${escapeHtml(SHEET_NAME)}" and "${escapeHtml(FEE_BALANCE_SHEET)}".</div>`;
  });
}

/**
 * Appends this dashboard's tracking columns after whatever the form produced,
 * so nobody has to add them by hand. They go at the first free column, which
 * keeps them correct even if the form gains questions later.
 */
function ensureTrackingColumns(rows){
  const header = (rows[0] || []).slice();
  const norm = header.map(normHeader);
  const missing = TRACKING_COLUMNS.filter(function(c){ return norm.indexOf(c.toLowerCase()) === -1; });
  if(!missing.length) return Promise.resolve(rows);

  const startIdx = header.length;
  const merged = header.concat(missing);
  const range = SHEET_NAME + "!" + colLetter(startIdx) + "1:" + colLetter(merged.length - 1) + "1";
  return sheetsUpdate(range, [missing]).then(function(){
    rows[0] = merged;
    return rows;
  });
}

function rowToResponse(row, sheetRow){
  const r = { sheetRow: sheetRow, timestamp: row[0] || "" };
  RESPONSE_FIELDS.forEach(function(f){
    const i = colMap[f.k];
    r[f.k] = (i === undefined || row[i] === undefined || row[i] === null) ? "" : row[i];
  });
  const g = function(name){
    const i = colMap["_" + name.replace(/\s+/g, "")];
    return (i === undefined || row[i] === undefined) ? "" : row[i];
  };
  r.fulfilled = String(g("Fulfilled") || "").toUpperCase() === "TRUE";
  r.notes = g("Notes") || "";
  const rawStage = String(g("Stage") || "").trim();
  r.stage = STAGES.indexOf(rawStage) > -1 ? rawStage : (r.fulfilled ? "Complete" : "Received");
  r.messageToStudent = g("Message to Student") || "";
  return r;
}

/** A1 range covering this row's four tracking columns, wherever they landed. */
function trackingRange(sheetRow){
  const first = colMap["_Fulfilled"];
  const last = colMap["_MessagetoStudent"];
  if(first === undefined || last === undefined) return null;
  return SHEET_NAME + "!" + colLetter(first) + sheetRow + ":" + colLetter(last) + sheetRow;
}

/* ===================== RENDER ===================== */
function renderFilterTabs(){
  const el = document.getElementById("filter-tabs");
  el.innerHTML = FILTERS.map(function(f){
    const count = f.key === "all" ? responses.length : responses.filter(function(r){ return filterKeyOf(r) === f.key; }).length;
    return `<button class="filter-tab${f.key === activeFilter ? " active" : ""}" data-filter="${f.key}">${f.label} (${count})</button>`;
  }).join("");
  el.querySelectorAll(".filter-tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      activeFilter = btn.getAttribute("data-filter");
      renderFilterTabs();
      render();
    });
  });
}

function visibleList(){
  let list = responses.slice().reverse(); // newest first
  if(activeFilter !== "all") list = list.filter(function(r){ return filterKeyOf(r) === activeFilter; });
  if(unfulfilledOnly) list = list.filter(function(r){ return !r.fulfilled; });
  if(mineOnly){
    const mine = counselorLabelFor(userEmail);
    if(mine) list = list.filter(function(r){ return String(r.counselor || "").trim() === mine; });
  }
  if(searchTerm){
    const q = searchTerm.toLowerCase();
    list = list.filter(function(r){
      return (r.name || "").toLowerCase().indexOf(q) !== -1
          || (r.email || "").toLowerCase().indexOf(q) !== -1;
    });
  }
  // Money due soonest first -- a deposit due Friday outranks an older request
  // with no deadline at all. Requests without a deadline fall to the back,
  // ordered by how long they've been waiting.
  if(viewMode === "queue"){
    list.sort(function(a, b){
      const da = daysUntilDeadline(a), db = daysUntilDeadline(b);
      if(da !== null && db !== null) return da - db;
      if(da !== null) return -1;
      if(db !== null) return 1;
      return (ageInDays(b) || 0) - (ageInDays(a) || 0);
    });
  }

  return list;
}

/* ---------- cohort summary ---------- */
function renderSummary(){
  const el = document.getElementById("summary");

  // Scope the strip exactly like the list, so the numbers always describe
  // what's on screen. Untick "only my students" for the cohort view.
  const mine = mineOnly ? counselorLabelFor(userEmail) : null;
  const scoped = mine
    ? responses.filter(function(r){ return String(r.counselor || "").trim() === mine; })
    : responses;

  const scopedKeys = new Set();
  scoped.forEach(function(r){
    const e = String(r.email || "").trim().toLowerCase();
    const n = nameKey(r.name);
    if(e) scopedKeys.add(e);
    if(n) scopedKeys.add(n);
  });
  const scopedFellows = mine
    ? feeRows.filter(function(f){ return scopedKeys.has(f.email) || scopedKeys.has(nameKey(f.name)); })
    : feeRows;

  const outstanding = scoped.filter(function(r){ return !r.fulfilled; });
  const dueSoon = outstanding.filter(function(r){
    const d = daysUntilDeadline(r);
    return d !== null && d <= STALE_DAYS;
  });
  const seniors = new Set(scoped.map(function(r){ return (r.email || r.name || "").toLowerCase(); }).filter(Boolean));

  const untouched = scopedFellows.filter(function(f){ return f.spent === 0; }).length;
  const spent = scopedFellows.reduce(function(sum, f){ return sum + f.spent; }, 0);
  const overdrawn = scopedFellows.filter(function(f){ return f.remaining < 0; }).length;

  const stats = [
    { n: outstanding.length, l: "Outstanding requests" },
    { n: dueSoon.length, l: "Money due within " + STALE_DAYS + " days", alert: dueSoon.length > 0 },
    { n: seniors.size, l: "Seniors who've requested" },
    { n: rosterOnly.length, l: "On roster, never requested" },
    { n: overdrawn, l: "Fellows over their balance", alert: overdrawn > 0 },
    { n: "$" + spent.toFixed(0), l: "Spent from senior funds" }
  ];

  el.innerHTML = stats.map(function(s){
    return '<div class="stat' + (s.alert ? " alert" : "") + '"><div class="n">' + s.n + "</div>"
      + '<div class="l">' + s.l + "</div></div>";
  }).join("");
}

function render(){
  renderSummary();
  const list = visibleList();
  document.getElementById("count-note").textContent = list.length + " request" + (list.length === 1 ? "" : "s");

  const container = document.getElementById("list");
  if(!list.length){
    container.innerHTML = '<div class="empty-state">Nothing here. ' +
      (unfulfilledOnly ? "Everything in this filter is fulfilled." : "No requests match this view.") + "</div>";
    return;
  }

  container.className = viewMode === "queue" ? "queue" : "list";
  let html = list.map(viewMode === "queue" ? queueRowHtml : cardHtml).join("");

  // Seniors on the attendance roster who have never submitted anything. They
  // sit below the real queue -- nothing to action, but easy to spot and chase.
  if(viewMode === "queue" && !searchTerm){
    const idle = visibleRosterOnly();
    if(idle.length){
      html += '<div class="roster-head">On the roster, no requests yet &mdash; ' + idle.length + "</div>"
        + idle.map(rosterRowHtml).join("");
    }
  }
  container.innerHTML = html;
  viewMode === "queue" ? wireQueue(container) : wireCards(container);
}

/* ---------- queue: one row, everything actionable inline ---------- */
function queueRowHtml(r){
  const age = ageInDays(r);
  const due = daysUntilDeadline(r);
  const showAmount = isFeeBearing(r);
  const isOpen = openRowIndex === String(r.sheetRow);
  const type = requestTypeOf(r) || "(no type)";

  // Urgent means the money is due soon (or already), not merely that the
  // request is old.
  const urgent = (due !== null && due <= 3) || (due === null && age !== null && age >= STALE_DAYS);

  let badge;
  if(due === null){
    badge = '<span class="qage' + (age !== null && age >= STALE_DAYS ? " old" : "") + '">'
          + (age === null ? "?" : age + "d old") + "</span>";
  } else if(due < 0){
    badge = '<span class="qage old">' + Math.abs(due) + "d overdue</span>";
  } else {
    badge = '<span class="qage' + (due <= 3 ? " old" : "") + '">due in ' + due + "d</span>";
  }

  // Would this request take them past what they have left?
  const remaining = showAmount ? remainingFor(r) : null;
  const asking = Number(defaultAmountFor(r)) || 0;
  const overBudget = remaining !== null && asking > 0 && asking > remaining;

  return '<div class="qrow' + (urgent ? " stale" : "") + '" data-idx="' + r.sheetRow + '">'
    + '<div class="qmain">'
    +   '<div class="qname">' + escapeHtml(r.name || "(no name)") + "</div>"
    +   '<div class="qmeta">' + escapeHtml(type) + " &middot; " + escapeHtml(r.counselor || "no counselor")
    +     (r.messageToStudent ? ' &middot; <span class="msg-hint">note sent</span>' : "")
    +     (overBudget
          ? ' &middot; <span class="over-budget">asking $' + asking.toFixed(2)
            + ", only $" + remaining.toFixed(2) + " left</span>"
          : (remaining !== null && showAmount ? ' &middot; $' + remaining.toFixed(2) + " left" : ""))
    +   "</div>"
    + "</div>"
    + badge
    + '<select class="fld-stage" title="Stage shown to the student">'
    +   STAGES.map(function(st){
          return '<option value="' + st + '"' + (r.stage === st ? " selected" : "") + ">" + st + "</option>";
        }).join("")
    + "</select>"
    + (showAmount
        ? '<input type="number" step="0.01" class="fld-amount" placeholder="Amount" value="' + escapeHtml(defaultAmountFor(r)) + '" />'
        : "")
    + '<button class="btn-done" data-sheetrow="' + r.sheetRow + '">Mark done</button>'
    + '<button class="qexpand" data-expand="' + r.sheetRow + '">' + (isOpen ? "Hide" : "Details") + "</button>"
    + (isOpen ? '<div class="qdetails">' + detailGridHtml(r) + messageFieldHtml(r) + "</div>" : "")
    + "</div>";
}

/** Roster-only seniors, respecting the counselor filter where we can. */
function visibleRosterOnly(){
  // The roster carries no counselor, so "only my students" can't scope it --
  // say so rather than silently showing everyone's.
  return mineOnly ? [] : rosterOnly;
}

function rosterRowHtml(p){
  const att = p.percent === null ? "attendance not recorded"
            : p.percent + "% attendance" + (p.percent < 80 ? " — below 80%" : "");
  return '<div class="qrow roster">'
    + '<div class="qmain">'
    +   '<div class="qname">' + escapeHtml(p.name) + "</div>"
    +   '<div class="qmeta">No requests yet &middot; ' + escapeHtml(att)
    +     (p.remaining !== null ? " &middot; $" + p.remaining.toFixed(2) + " available" : "")
    +   "</div>"
    + "</div>"
    + '<span class="qage' + (p.percent !== null && p.percent < 80 ? " old" : "") + '">roster</span>'
    + "</div>";
}

function detailGridHtml(r){
  let rows = "";
  COLUMN_ORDER.forEach(function(key){
    if(!FIELD_LABELS[key]) return;
    const v = r[key];
    if(!v) return;
    rows += '<div class="dg-label">' + FIELD_LABELS[key] + '</div><div class="dg-value">' + escapeHtml(v) + "</div>";
  });
  return '<div class="detail-grid">' + rows + "</div>";
}

function messageFieldHtml(r){
  return '<div class="action-row">'
    + '<div class="action-field"><label>Message to student (they see this in their portal)</label>'
    +   '<input type="text" class="fld-message wide" placeholder="e.g. Waiting on your ACT login" value="' + escapeHtml(r.messageToStudent) + '" /></div>'
    + '<div class="action-field"><label>Internal notes (students never see this)</label>'
    +   '<input type="text" class="fld-notes" placeholder="e.g. 7/14/26 - JS" value="' + escapeHtml(r.notes) + '" /></div>'
    + '<button class="btn-save" data-sheetrow="' + r.sheetRow + '">Save</button>'
    + "</div>";
}

function wireQueue(container){
  container.querySelectorAll(".btn-done").forEach(function(btn){
    btn.addEventListener("click", function(){
      saveRow(btn.getAttribute("data-sheetrow"), { markFulfilled: true });
    });
  });
  container.querySelectorAll(".btn-save").forEach(function(btn){
    btn.addEventListener("click", function(){ saveRow(btn.getAttribute("data-sheetrow"), {}); });
  });
  container.querySelectorAll(".qexpand").forEach(function(btn){
    btn.addEventListener("click", function(){
      const id = btn.getAttribute("data-expand");
      openRowIndex = (openRowIndex === id) ? null : id;
      render();
    });
  });
}

/* ---------- full cards ---------- */
function wireCards(container){
  container.querySelectorAll(".req-card-head").forEach(function(head){
    head.addEventListener("click", function(){
      const card = head.closest(".req-card");
      const idx = card.getAttribute("data-idx");
      openRowIndex = (openRowIndex === idx) ? null : idx;
      render();
    });
  });
  container.querySelectorAll(".btn-save").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      saveRow(btn.getAttribute("data-sheetrow"), {});
    });
  });
  container.querySelectorAll(".req-card-body").forEach(function(body){
    body.addEventListener("click", function(e){ e.stopPropagation(); });
  });
}

function cardHtml(r){
  const idx = String(r.sheetRow);
  const isOpen = openRowIndex === idx;
  const type = requestTypeOf(r) || "(no type)";
  const feeAmount = isFeeBearing(r) ? defaultAmountFor(r) : "";

  return '<div class="req-card' + (r.fulfilled ? " fulfilled" : "") + (isOpen ? " open" : "") + '" data-idx="' + idx + '">'
    + '<div class="req-card-head">'
    +   '<span class="req-badge">' + escapeHtml(type) + "</span>"
    +   "<div><div class=\"rc-name\">" + escapeHtml(r.name || "(no name)") + "</div>"
    +   '<div class="rc-meta">' + escapeHtml(r.timestamp) + " &middot; " + escapeHtml(r.email)
    +     " &middot; Counselor: " + escapeHtml(r.counselor) + "</div></div>"
    +   '<span class="spacer"></span>'
    +   (r.fulfilled ? '<span class="fulfilled-pill">Fulfilled</span>'
                     : '<span class="req-badge">' + escapeHtml(r.stage) + "</span>")
    + "</div>"
    + '<div class="req-card-body">'
    +   detailGridHtml(r)
    +   '<div class="action-row">'
    +     '<div class="action-field"><label>Stage (student sees this)</label><select class="fld-stage">'
    +       STAGES.map(function(st){
              return '<option value="' + st + '"' + (r.stage === st ? " selected" : "") + ">" + st + "</option>";
            }).join("")
    +     "</select></div>"
    +     (isFeeBearing(r)
          ? '<div class="action-field"><label>Amount Paid ($)</label><input type="number" step="0.01" class="fld-amount" value="' + escapeHtml(feeAmount) + '" /></div>'
          : "")
    +     '<label class="checkbox-field"><input type="checkbox" class="fld-fulfilled" ' + (r.fulfilled ? "checked" : "") + " /> Fulfilled</label>"
    +   "</div>"
    +   messageFieldHtml(r)
    +   '<div class="save-note">' + (isFeeBearing(r) ? "Marking this fulfilled logs the amount to the fellow's Spending Log." : "") + "</div>"
    + "</div></div>";
}

/* ===================== EXPORT ===================== */
/**
 * One row per logged expense, with the fellow's context attached, so usage
 * rolls up by fellow, high school, counselor or fee type in a pivot. Dollars
 * come from the Spending Log (what was actually paid), not from the amount
 * typed on a request.
 */
function buildExportRows(){
  // Context (school, counselor) comes from each fellow's own request rows.
  const ctxByKey = {};
  responses.forEach(function(r){
    const keys = [String(r.email || "").toLowerCase(), nameKey(r.name)].filter(Boolean);
    keys.forEach(function(k){
      if(ctxByKey[k]) return;
      ctxByKey[k] = {
        highSchool: r.highSchool || r.capHighSchool || "",
        counselor: r.counselor || "",
        role: r.role || ""
      };
    });
  });

  const header = ["Fellow Name","Email","High School","Counselor","Fellow or Advisee",
                  "Starting Funds","Total Spent","Remaining","Payments Recorded"];
  const rows = [header];

  feeRows.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(f){
    const ctx = ctxByKey[f.email] || ctxByKey[nameKey(f.name)] || {};
    rows.push([f.name, f.email, ctx.highSchool || "", ctx.counselor || "", ctx.role || "",
               f.startingFunds, f.spent, f.remaining, f.usedTriplets]);
  });

  return rows;
}

function toCsv(rows){
  return rows.map(function(row){
    return row.map(function(cell){
      const v = String(cell == null ? "" : cell);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(",");
  }).join("\n");
}

function exportFundsUsage(){
  const rows = buildExportRows();
  if(rows.length < 2){ showToast("Nothing to export yet."); return; }
  const blob = new Blob([toCsv(rows)], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "bryc-senior-funds-usage-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Exported " + (rows.length - 1) + " rows.");
}

/* ===================== SAVE ===================== */
/**
 * Writes columns AX:BA (Fulfilled, Notes, Stage, Message to Student) for one
 * row, logs the spend if this is the moment a fee request became fulfilled,
 * and then emails the student if anything they'd care about changed.
 *
 * opts.markFulfilled is what the queue's "Mark done" button passes -- there's
 * no checkbox in that view, the button IS the checkbox.
 */
function saveRow(sheetRowStr, opts){
  opts = opts || {};
  const sheetRow = Number(sheetRowStr);
  const r = responses.find(function(x){ return x.sheetRow === sheetRow; });
  if(!r) return;

  const scope = document.querySelector('[data-idx="' + sheetRow + '"]');
  if(!scope) return;
  const pick = function(sel){ return scope.querySelector(sel); };

  const notesInput = pick(".fld-notes");
  const messageInput = pick(".fld-message");
  const fulfilledInput = pick(".fld-fulfilled");
  const amountInput = pick(".fld-amount");
  const stageSelect = pick(".fld-stage");

  const wasFulfilled = r.fulfilled;
  const nowFulfilled = opts.markFulfilled ? true : (fulfilledInput ? fulfilledInput.checked : r.fulfilled);
  const notes = notesInput ? notesInput.value : r.notes;
  const message = messageInput ? messageInput.value : r.messageToStudent;
  const amount = amountInput ? Number(amountInput.value) || 0 : 0;
  // Fulfilling always lands the student on the final stage.
  const stage = nowFulfilled ? "Complete" : (stageSelect ? stageSelect.value : r.stage);

  const range = trackingRange(sheetRow);
  if(!range){ showToast("Tracking columns are missing — reload the page so they get created."); return; }

  const btn = pick(".btn-done") || pick(".btn-save");
  const btnLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }

  const messageChanged = String(message).trim() !== String(r.messageToStudent).trim();
  const becameFulfilled = !wasFulfilled && nowFulfilled;

  sheetsUpdate(range, [[nowFulfilled ? "TRUE" : "FALSE", notes, stage, message]])
    .then(function(){
      // Record the payment on Fee Payment Balance the moment a fee request
      // becomes fulfilled -- this is what keeps the sheet and the portal in step.
      if(becameFulfilled && isFeeBearing(r) && amount > 0){
        return logPayment(r, amount, defaultDescriptionFor(r));
      }
      return null;
    })
    .then(function(feeRow){
      r.fulfilled = nowFulfilled;
      r.notes = notes;
      r.stage = stage;
      r.messageToStudent = message;

      const mails = [];
      if(becameFulfilled) mails.push(notifyStudent(sheetRow, "fulfilled"));
      else if(messageChanged && String(message).trim()) mails.push(notifyStudent(sheetRow, "message"));

      return Promise.all(mails).then(function(results){
        const emailed = results.filter(function(x){ return x && x.status === "ok"; }).length;
        const failed = results.filter(function(x){ return x && x.status && x.status !== "ok"; });

        if(feeRow){
          showToast("Saved. Logged $" + amount.toFixed(2) + " to " + feeRow.name
            + " — $" + feeRow.remaining.toFixed(2) + " left."
            + (emailed ? " Student emailed." : ""));
        } else if(failed.length){
          showToast("Saved, but the student email didn't send: " + (failed[0].message || failed[0].status));
        } else {
          showToast("Saved." + (emailed ? " Student emailed." : ""));
        }

        if(btn){ btn.disabled = false; btn.textContent = btnLabel; }
        renderFilterTabs();
        render();
      });
    })
    .catch(function(err){
      if(btn){ btn.disabled = false; btn.textContent = btnLabel; }
      // The tracking columns already saved; only the payment leg failed.
      showToast(err.message);
      r.fulfilled = nowFulfilled; r.notes = notes; r.stage = stage; r.messageToStudent = message;
      render();
    });
}

  initFirebase();
  document.getElementById("signin-btn").addEventListener("click", doSignIn);
  document.getElementById("denied-back-btn").addEventListener("click", function(){

    document.getElementById("auth-overlay").style.display = "flex";
  });
  document.getElementById("signout-btn").addEventListener("click", function(){
    auth.signOut().then(function(){
      accessToken = null; userEmail = null;
      document.getElementById("app").style.display = "none";
      document.getElementById("auth-overlay").style.display = "flex";
    });
  });
  document.getElementById("search-input").addEventListener("input", function(e){
    searchTerm = e.target.value;
    render();
  });
  document.getElementById("unfulfilled-only").addEventListener("change", function(e){
    unfulfilledOnly = e.target.checked;
    render();
  });
  document.getElementById("email-students").addEventListener("change", function(e){
    emailStudents = e.target.checked;
  });
  document.getElementById("export-btn").addEventListener("click", exportFundsUsage);
  document.getElementById("mine-only").addEventListener("change", function(e){
    mineOnly = e.target.checked;

  });
  const setView = function(mode){
    viewMode = mode;
    openRowIndex = null;

    document.getElementById("view-all").classList.toggle("active", mode === "all");
    render();
  };
  document.getElementById("view-queue").addEventListener("click", function(){ setView("queue"); });
  document.getElementById("view-all").addEventListener("click", function(){ setView("all"); });
});

})();
