<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<title>BRYC Senior Portal</title>
<!-- Proxima Nova via BRYC's Adobe Typekit kit -->
<link rel="stylesheet" href="https://use.typekit.net/oyd0hvb.css" />
<style>
  :root{
    /* Senior & Advising (12th) teal palette */
    --dark-teal:#2a6465;
    --mid-teal:#007f81;
    --teal:#05a09c;
    --bright-teal:#00adad;
    --light-teal:#40bfbb;
    --sky:#7fd1e0;
    --pale-teal:#b1e1e9;
    --ghost-teal:#d0ecef;

    --ok-bg:#e3f3e8;
    --ok-ink:#1B4332;
    --warn-bg:#fbe4e1;
    --warn-ink:#a8402f;
    --pending-bg:#fff6e0;
    --pending-ink:#8a6415;

    --ink:#1c2b2b;
    --muted:#5b7573;
    --border:#dfeceb;
    --page-bg:#f4faf9;
    --shadow:0 8px 28px rgba(42,100,101,0.14);
    --shadow-sm:0 2px 10px rgba(42,100,101,0.09);
    --radius:14px;
    --font:'proxima-nova',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    /* Solid fallback; the gradient itself is the fixed ::before layer below.
       `background-attachment:fixed` alone stops painting past the first
       viewport on a long dashboard, which left a white void on scroll. */
    background:var(--mid-teal);
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 64px;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:linear-gradient(160deg,var(--dark-teal),var(--mid-teal) 55%,var(--bright-teal));
  }
  h1,h2,h3{font-family:var(--font);font-weight:600;margin:0;}
  a{color:var(--mid-teal);}
  button{font-family:var(--font);}

  .wrap{max-width:680px;margin:0 auto;}
  .wrap.wide{max-width:820px;}

  /* ---------- top-level mode tabs ---------- */
  .mode-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .mode-tab{
    background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.28);color:#fff;
    padding:9px 20px;border-radius:22px;font-size:13.5px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .mode-tab:hover{background:rgba(255,255,255,0.24);}
  .mode-tab.active{background:#fff;color:var(--dark-teal);border-color:#fff;}
  /* Staff is not for students -- set apart and understated, not hidden. */
  .mode-tab-staff{margin-left:14px;opacity:.7;font-weight:500;}
  .mode-tab-staff:hover,.mode-tab-staff.active{opacity:1;}

  /* ---------- embedded request form ---------- */
  .form-frame{width:100%;height:1500px;border:0;display:block;background:#fff;}
  .form-note{
    font-size:12.5px;color:var(--muted);line-height:1.6;
    padding:14px 20px;border-top:1px solid var(--border);background:var(--page-bg);
  }
  .form-note a{font-weight:600;}
  @media (max-width:560px){ .form-frame{height:1650px;} }

  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;}
  .brand .brand-logo{height:36px;width:auto;filter:brightness(0) invert(1);}

  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .card-header{
    background:linear-gradient(120deg,var(--dark-teal),var(--mid-teal));
    color:#fff;padding:22px 28px;
  }
  .card-header h1{font-size:20px;line-height:1.25;}
  .card-header .tag{
    display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.6px;color:#fff;background:rgba(255,255,255,0.18);
    padding:3px 10px;border-radius:20px;margin-bottom:8px;
  }
  .card-body{padding:26px 28px 28px;}

  .lede{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px;}

  /* ---------- form controls ---------- */
  .field{margin-bottom:18px;}
  .field label.q{display:block;font-size:14px;font-weight:600;color:var(--dark-teal);margin-bottom:7px;}
  .field input{
    width:100%;padding:12px 14px;font-size:15px;font-family:var(--font);
    border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{
    outline:none;border-color:var(--bright-teal);
    box-shadow:0 0 0 3px rgba(0,173,173,0.16);
  }
  .field.invalid input{border-color:var(--warn-ink);}
  .field .hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5;}

  .pin-input{
    text-align:center;font-size:30px !important;font-weight:700;
    letter-spacing:14px;text-indent:14px;padding:14px 10px !important;
    color:var(--dark-teal);
  }

  .btn{
    border:none;border-radius:10px;padding:12px 22px;font-size:14.5px;font-weight:600;
    cursor:pointer;transition:transform .08s, filter .15s, background .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn-primary{background:var(--bright-teal);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--teal);}
  .btn-secondary{background:var(--ghost-teal);color:var(--dark-teal);}
  .btn-secondary:hover:not(:disabled){background:var(--pale-teal);}
  .btn-block{width:100%;}
  .btn-link{
    background:none;border:none;color:var(--mid-teal);font-size:13.5px;font-weight:600;
    cursor:pointer;padding:6px 0;text-decoration:underline;
  }

  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .spacer{flex:1;}

  /* ---------- messages ---------- */
  .msg{
    border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.55;
    margin-bottom:18px;
  }
  .msg-error{background:var(--warn-bg);color:var(--warn-ink);}
  .msg-info{background:var(--ghost-teal);color:var(--dark-teal);}
  .msg-ok{background:var(--ok-bg);color:var(--ok-ink);}

  .lock-note{
    display:flex;gap:9px;align-items:flex-start;
    font-size:12.5px;color:var(--muted);line-height:1.55;
    border-top:1px solid var(--border);margin-top:22px;padding-top:16px;
  }
  .lock-note .ico{color:var(--teal);font-size:14px;line-height:1.35;}

  /* ---------- dashboard ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;
    background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);
    border-radius:12px;padding:10px 14px;margin-bottom:18px;
    backdrop-filter:blur(4px);
  }
  .topbar .who{color:#fff;font-size:13px;line-height:1.35;min-width:0;}
  .topbar .who b{display:block;font-size:14.5px;font-weight:700;}
  .topbar .who span{opacity:.8;word-break:break-all;}
  .topbar .signout{
    background:rgba(255,255,255,0.18);border:none;color:#fff;
    font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;
    white-space:nowrap;
  }
  .topbar .signout:hover{background:rgba(255,255,255,0.3);}

  .panel{
    background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-sm);
    padding:22px 24px;margin-bottom:16px;
  }
  .panel-title{
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.9px;
    color:var(--mid-teal);margin-bottom:14px;
  }
  .greet{color:#fff;margin-bottom:16px;}
  .greet h2{font-size:26px;color:#fff;margin-bottom:2px;}
  .greet p{margin:0;font-size:13.5px;color:rgba(255,255,255,0.85);}

  .funds-numbers{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .funds-numbers .big{font-size:42px;font-weight:700;color:var(--dark-teal);line-height:1;}
  .funds-numbers .lbl{font-size:14px;color:var(--muted);}
  .funds-bar-track{height:12px;background:var(--ghost-teal);border-radius:20px;overflow:hidden;}
  .funds-bar-fill{
    height:100%;border-radius:20px;
    background:linear-gradient(90deg,var(--mid-teal),var(--bright-teal),var(--light-teal));
    transition:width .5s ease;
  }
  .funds-caption{font-size:13px;color:var(--muted);margin-top:9px;}

  .spend-row{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:11px 0;border-bottom:1px solid var(--border);
  }
  .spend-row:last-child{border-bottom:none;}
  .sr-desc{font-size:14px;font-weight:600;color:var(--ink);}
  .sr-date{font-size:12px;color:var(--muted);margin-top:2px;}
  .sr-amt{font-size:15px;font-weight:700;color:var(--dark-teal);white-space:nowrap;}
  .empty{color:var(--muted);font-size:13.5px;line-height:1.6;}

  .status-box{border-radius:10px;padding:13px 15px;font-size:13.5px;line-height:1.6;}
  .status-ok{background:var(--ok-bg);color:var(--ok-ink);}
  .status-warn{background:var(--warn-bg);color:var(--warn-ink);}
  .status-pending{background:var(--ghost-teal);color:var(--dark-teal);}

  /* ---------- request cards ---------- */
  .req-card{
    border:1.5px solid var(--border);border-radius:12px;margin-bottom:12px;
    overflow:hidden;transition:border-color .15s;
  }
  .req-card:last-child{margin-bottom:0;}
  .req-card.open{border-color:var(--light-teal);}
  .req-head{
    display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;
    background:#fff;
  }
  .req-head:hover{background:var(--page-bg);}
  .req-head .txt{flex:1;min-width:0;}
  .req-type{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.35;}
  .req-date{font-size:12px;color:var(--muted);margin-top:3px;}
  .pill{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;
    padding:4px 10px;border-radius:20px;white-space:nowrap;
  }
  .pill-ok{background:var(--ok-bg);color:var(--ok-ink);}
  .pill-pending{background:var(--pending-bg);color:var(--pending-ink);}
  .chev{color:var(--muted);font-size:12px;transition:transform .18s;}
  .req-card.open .chev{transform:rotate(180deg);}
  .req-body{padding:4px 16px 16px;background:var(--page-bg);border-top:1px solid var(--border);}
  .detail-row{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .dl{font-size:12.5px;color:var(--muted);flex:0 0 44%;line-height:1.45;}
  .detail-row .dv{font-size:13.5px;color:var(--ink);flex:1;word-break:break-word;line-height:1.45;}

  /* ---------- progress trail ---------- */
  .trail{display:flex;align-items:flex-start;margin:16px 0 4px;}
  .trail-node{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0;}
  .trail-node .dot{
    width:15px;height:15px;border-radius:50%;background:var(--ghost-teal);
    border:2px solid var(--ghost-teal);z-index:1;transition:background .2s;
  }
  .trail-node.done .dot{background:var(--bright-teal);border-color:var(--bright-teal);}
  .trail-node.current .dot{
    background:#fff;border-color:var(--bright-teal);
    box-shadow:0 0 0 4px rgba(0,173,173,0.2);
  }
  .trail-node::before,.trail-node::after{
    content:"";position:absolute;top:8px;height:3px;background:var(--ghost-teal);
  }
  .trail-node::before{left:0;right:50%;}
  .trail-node::after{left:50%;right:0;}
  .trail-node:first-child::before,.trail-node:last-child::after{display:none;}
  .trail-node.done::before,.trail-node.current::before{background:var(--bright-teal);}
  .trail-node.done::after{background:var(--bright-teal);}
  .trail-node .lbl{
    font-size:11px;font-weight:600;color:var(--muted);margin-top:8px;
    text-align:center;line-height:1.3;padding:0 3px;
  }
  .trail-node.done .lbl,.trail-node.current .lbl{color:var(--dark-teal);}
  .trail-node.current .lbl{font-weight:700;}
  .turnaround{font-size:12px;color:var(--muted);line-height:1.55;margin-top:12px;}

  .missed{margin-top:16px;}
  .missed-hdr{font-size:11.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.7px;color:var(--muted);margin-bottom:8px;}
  .missed-chip{display:inline-block;background:var(--warn-bg);color:var(--warn-ink);
    font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;margin:0 6px 6px 0;}

  /* ---------- counselor message + next step ---------- */
  .from-counselor{
    background:var(--ghost-teal);border-left:4px solid var(--bright-teal);
    border-radius:0 9px 9px 0;padding:12px 14px;margin-top:14px;
  }
  .from-counselor .hdr{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;
    color:var(--mid-teal);margin-bottom:5px;
  }
  .from-counselor .body{font-size:13.5px;color:var(--ink);line-height:1.6;}
  .next-step{
    background:var(--page-bg);border:1px solid var(--border);border-radius:9px;
    padding:12px 14px;margin-top:12px;font-size:13.5px;color:var(--ink);line-height:1.6;
  }
  .next-step b{color:var(--dark-teal);display:block;margin-bottom:3px;font-size:12.5px;}

  /* ---------- funds explainer ---------- */
  .explainer-toggle{
    width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:0;
    display:flex;align-items:center;gap:10px;
    font-size:14.5px;font-weight:600;color:var(--dark-teal);
  }
  .explainer-toggle .chev{margin-left:auto;color:var(--muted);font-size:12px;}
  .explainer.open .explainer-toggle .chev{transform:rotate(180deg);}
  .explainer-body{margin-top:16px;font-size:13.5px;line-height:1.65;color:var(--ink);}
  .explainer-body h4{
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;
    color:var(--mid-teal);margin:18px 0 8px;
  }
  .explainer-body h4:first-child{margin-top:0;}
  .explainer-body ul{margin:0;padding-left:20px;}
  .explainer-body li{margin-bottom:6px;}
  .explainer-body p{margin:0 0 10px;}
  .covered{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px;}
  .covered .mark{color:var(--teal);font-weight:700;flex:0 0 auto;line-height:1.5;}
  .covered .no{color:var(--warn-ink);}

  .newreq{
    display:inline-block;background:var(--bright-teal);color:#fff;text-decoration:none;
    font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:9px;margin-top:4px;
  }
  .newreq:hover{background:var(--teal);color:#fff;}
  .panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .panel-head .panel-title{margin-bottom:0;}

  .center-msg{text-align:center;padding:34px 10px;}
  .center-msg .ico{font-size:32px;margin-bottom:12px;}
  .center-msg h2{font-size:18px;color:var(--dark-teal);margin-bottom:6px;}
  .center-msg p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.6;}

  .spinner{
    width:30px;height:30px;border-radius:50%;margin:0 auto 14px;
    border:3px solid var(--ghost-teal);border-top-color:var(--bright-teal);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .footnote{
    text-align:center;color:rgba(255,255,255,0.75);font-size:12px;line-height:1.6;
    margin-top:22px;
  }
  .footnote a{color:#fff;}

  @media (max-width:560px){
    body{padding:20px 12px 48px;}
    .card-body,.panel{padding:20px 18px;}
    .funds-numbers .big{font-size:34px;}
    .detail-row{flex-direction:column;gap:2px;}
    .detail-row .dl{flex:none;}
  }

  /* =====================================================================
   * STAFF DASHBOARD -- every selector is scoped to #staff so none of it can
   * reach the student-facing markup. Only .req-card actually collided, but
   * scoping the whole sheet means future edits to either side stay safe.
   * ================================================================== */
#staff{
    --dark-teal:#2a6465;
    --mid-teal:#007f81;
    --bright-teal:#00adad;
    --light-teal:#40bfbb;
    --pale-teal:#b1e1e9;
    --ghost-teal:#d0ecef;
    --forest:#1B4332;
    --warn-bg:#fbe4e1;
    --warn-ink:#a8402f;
    --ink:#1c2b2b;
    --muted:#5b7573;
    --border:#dfeceb;
    --page-bg:#f4faf9;
    --shadow:0 4px 16px rgba(42,100,101,0.1);
    --radius:12px;
    --font:'proxima-nova',-apple-system,BlinkMacSystemFont,sans-serif;
  }
#staff *{box-sizing:border-box;}
#staff{font-family:var(--font);background:var(--page-bg);color:var(--ink);}
#staff a{color:var(--mid-teal);}
#staff button{font-family:inherit;cursor:pointer;}
#staff #auth-overlay{
    position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--dark-teal),var(--mid-teal));
  }
#staff .auth-card{background:#fff;border-radius:var(--radius);padding:44px 38px;width:360px;max-width:90vw;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,0.2);}
#staff .auth-card h1{font-size:19px;color:var(--dark-teal);margin:0 0 6px;}
#staff .auth-card p{color:var(--muted);font-size:13.5px;margin:0 0 22px;}
#staff .google-btn{
    display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #d8dfe0;border-radius:8px;
    padding:11px 18px;font-size:14px;font-weight:500;color:#3c4043;width:100%;justify-content:center;
  }
#staff .google-btn:hover{box-shadow:0 2px 6px rgba(0,0,0,0.15);}
#staff .auth-error{color:var(--warn-ink);font-size:13px;margin-top:14px;display:none;}
#staff #access-denied{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--dark-teal),var(--forest));}
#staff #access-denied .auth-card h1{color:var(--warn-ink);}
#staff #app{display:none;}
#staff .back-to-site{background:none;border:none;color:var(--muted);font-size:12.5px;
  margin-top:16px;cursor:pointer;text-decoration:underline;}
#staff .back-to-site:hover{color:var(--dark-teal);}
#staff header.topbar{
    background:linear-gradient(120deg,var(--dark-teal),var(--mid-teal));color:#fff;
    padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
#staff header.topbar h1{font-size:17px;font-weight:700;margin:0;}
#staff header.topbar .spacer{flex:1;}
#staff header.topbar .who{font-size:12.5px;color:var(--ghost-teal);}
#staff header.topbar .signout{font-size:12px;color:#fff;text-decoration:underline;cursor:pointer;margin-left:12px;}
#staff .controls{
    background:#fff;border-bottom:1px solid var(--border);padding:14px 26px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:10;
  }
#staff .filter-tab{
    border:1px solid var(--border);background:#fff;color:var(--dark-teal);border-radius:20px;
    padding:7px 14px;font-size:12.5px;font-weight:600;
  }
#staff .filter-tab.active{background:var(--dark-teal);color:#fff;border-color:var(--dark-teal);}
#staff .search-input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;width:200px;font-family:inherit;}
#staff .toggle-row{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-left:auto;}
#staff .count-note{font-size:12px;color:var(--muted);margin-left:6px;}
#staff .list{max-width:920px;margin:20px auto;padding:0 20px 60px;}
#staff .req-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
#staff .req-card.fulfilled{opacity:0.7;}
#staff .req-card-head{padding:14px 18px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
#staff .req-card-head .rc-name{font-weight:700;font-size:14px;}
#staff .req-card-head .rc-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
#staff .req-badge{
    display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;
    padding:3px 9px;border-radius:20px;background:var(--ghost-teal);color:var(--dark-teal);flex-shrink:0;
  }
#staff .req-card-head .spacer{flex:1;}
#staff .fulfilled-pill{font-size:10.5px;font-weight:700;color:var(--forest);background:#e3f3e8;padding:3px 9px;border-radius:20px;}
#staff .req-card-body{padding:0 18px 16px;border-top:1px solid var(--border);display:none;}
#staff .req-card.open .req-card-body{display:block;}
#staff .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12.5px;margin:14px 0;}
#staff .detail-grid .dg-label{color:var(--muted);}
#staff .detail-grid .dg-value{color:var(--ink);font-weight:600;word-break:break-word;}
#staff .action-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
#staff .action-field{display:flex;flex-direction:column;gap:4px;}
#staff .action-field label{font-size:11px;font-weight:600;color:var(--dark-teal);}
#staff .action-field input[type=text], #staff .action-field input[type=number]{
    border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;width:160px;
  }
#staff .checkbox-field{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;}
#staff .btn-save{background:var(--mid-teal);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;}
#staff .btn-save:hover{background:var(--bright-teal);}
#staff .save-note{font-size:11.5px;color:var(--muted);}
#staff /* ---------- cohort summary strip ---------- */
  .summary{max-width:920px;margin:20px auto 0;padding:0 20px;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
#staff .stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px;}
#staff .stat .n{font-size:24px;font-weight:700;color:var(--dark-teal);line-height:1.1;}
#staff .stat .l{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4;}
#staff .stat.alert .n{color:var(--warn-ink);}
#staff .stat.alert{border-color:#f2cfc9;background:var(--warn-bg);}
#staff /* ---------- view switcher ---------- */
  .view-switch{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
#staff .view-switch button{background:#fff;border:none;padding:7px 15px;font-size:12.5px;font-weight:600;color:var(--dark-teal);}
#staff .view-switch button.active{background:var(--dark-teal);color:#fff;}
#staff /* ---------- queue ---------- */
  .queue{max-width:920px;margin:20px auto;padding:0 20px 60px;}
#staff .qrow{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:10px;padding:12px 16px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
#staff .qrow.stale{border-left:4px solid var(--warn-ink);}
#staff .qrow.roster{opacity:.85;border-style:dashed;}
#staff .roster-head{max-width:920px;margin:26px 0 10px;font-size:11.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);}
#staff .qrow .qmain{flex:1 1 220px;min-width:0;}
#staff .qrow .qname{font-weight:700;font-size:14px;}
#staff .qrow .qmeta{font-size:11.5px;color:var(--muted);margin-top:2px;}
#staff .over-budget{color:var(--warn-ink);font-weight:700;}
#staff .qrow .qage{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
    background:var(--ghost-teal);color:var(--dark-teal);white-space:nowrap;}
#staff .qrow .qage.old{background:var(--warn-bg);color:var(--warn-ink);}
#staff .qrow input[type=number]{border:1px solid var(--border);border-radius:6px;padding:7px 9px;
    font-size:13px;font-family:inherit;width:96px;}
#staff .qrow select{border:1px solid var(--border);border-radius:6px;padding:7px 9px;
    font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink);}
#staff .btn-done{background:var(--bright-teal);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;font-size:13px;font-weight:700;white-space:nowrap;}
#staff .btn-done:hover{background:var(--mid-teal);}
#staff .btn-done:disabled{opacity:.5;}
#staff .qexpand{background:none;border:none;color:var(--mid-teal);font-size:12px;
    text-decoration:underline;padding:4px 0;}
#staff .qdetails{flex:1 1 100%;border-top:1px dashed var(--border);margin-top:4px;padding-top:10px;}
#staff .action-field select{border:1px solid var(--border);border-radius:6px;padding:7px 9px;
    font-size:13px;font-family:inherit;width:160px;background:#fff;}
#staff .action-field input.wide{width:280px;}
#staff .msg-hint{font-size:11px;color:var(--mid-teal);font-weight:600;}
#staff .empty-state{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;}
#staff .toast{
    position:fixed;bottom:22px;right:22px;background:var(--forest);color:#fff;padding:10px 18px;
    border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.2);display:none;z-index:300;
  }
</style>
</head>
<body>

<div class="wrap" id="root"></div>

<!-- Staff dashboard. Inert until the Staff tab is chosen. -->
<div id="staff" style="display:none;">
<div id="auth-overlay">
  <div class="auth-card">
    <h1>BRYC Admin</h1>
    <p>Senior Support Requests — staff sign-in required.</p>
    <button class="google-btn" id="signin-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.8.54-1.84.86-3.05.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.34C2.38 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.69c-.18-.54-.28-1.11-.28-1.69s.1-1.15.28-1.69V4.97H.9A8.97 8.97 0 000 9c0 1.45.35 2.83.9 4.03l3.05-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.38 2.02.9 4.97l3.05 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="auth-error"></div>
    <button class="back-to-site" onclick="__backToStudentSite()">&larr; Back to the student site</button>
  </div>
</div>

<div id="access-denied">
  <div class="auth-card">
    <h1>Access Restricted</h1>
    <p>This admin view is restricted to authorized BRYC staff accounts.</p>
    <button class="google-btn" id="denied-back-btn" style="justify-content:center;">Back to Sign In</button>
    <button class="back-to-site" onclick="__backToStudentSite()">&larr; Back to the student site</button>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <h1>BRYC Admin — Senior Requests</h1>
    <div class="spacer"></div>
    <div class="who" id="who-label"></div>
    <span class="signout" id="signout-btn">Sign out</span>
  </header>

  <div class="controls" id="filter-tabs"><!-- rendered by JS --></div>

  <div class="controls" style="border-top:none;">
    <div class="view-switch">
      <button id="view-queue" class="active">Queue</button>
      <button id="view-all">All requests</button>
    </div>
    <input class="search-input" id="search-input" type="text" placeholder="Search by name…" />
    <label class="toggle-row" style="margin-left:0;"><input type="checkbox" id="email-students" checked /> Email students on changes</label>
    <label class="toggle-row" id="mine-only-wrap" style="display:none;margin-left:0;"><input type="checkbox" id="mine-only" checked /> <span id="mine-only-label">Only my students</span></label>
    <label class="toggle-row"><input type="checkbox" id="unfulfilled-only" checked /> Show unfulfilled only</label>
    <span class="count-note" id="count-note"></span>
    <button id="export-btn" class="filter-tab" style="margin-left:auto;">Export funds usage (CSV)</button>
  </div>

  <div class="summary" id="summary"><!-- rendered by JS --></div>

  <div class="list" id="list"><!-- rendered by JS --></div>
</div>

<div class="toast" id="toast"></div>
</div>

/* ===========================================================================
 * STATE
 * ---------------------------------------------------------------------------
 * The session token lives in sessionStorage, not localStorage: it dies the
 * moment the tab closes, so a shared library/school computer doesn't keep a
 * senior signed in for whoever sits down next.
 * ======================================================================== */

// Which half of the site you're on. Defaults to the request form because a
// senior who has never submitted anything cannot sign in yet -- sign-in is
// gated on their email appearing on a submitted request.
let mode = "request";    // request | status
let view = "email";      // email | pin | loading | dashboard
let emailValue = "";
let pinValue = "";
let token = sessionStorage.getItem("bryc_portal_token") || "";
let data = null;
let errorMsg = "";
let noticeMsg = "";
let busy = false;
let openReq = 0;          // newest request starts expanded: answers "did you get it?"
let explainerOpen = false;
let idleTimer = null;
let warnTimer = null;

/* ===========================================================================
 * TRANSPORT
 * ---------------------------------------------------------------------------
 * JSONP rather than fetch(): Apps Script Web Apps don't reliably answer
 * cross-origin fetch() reads from a GitHub Pages origin, but a <script> tag
 * has no such restriction. (Same approach as the request form's lookup.)
 * ======================================================================== */

function jsonpFetch(params){
  return new Promise(function(resolve, reject){
    if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
      reject(new Error("The portal isn't connected to the BRYC spreadsheet yet."));
      return;
    }
    const cbName = "bryc_portal_cb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const script = document.createElement("script");
    let done = false;
    const cleanup = function(){
      try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(function(){
      if(done) return;
      done = true; cleanup();
      reject(new Error("The request timed out."));
    }, 20000);

    window[cbName] = function(payload){
      if(done) return;
      done = true; clearTimeout(timer); cleanup();
      resolve(payload || {});
    };
    const query = Object.keys(params).map(function(k){
      return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
    }).join("&");
    script.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?") > -1 ? "&" : "?")
      + query + "&callback=" + cbName;
    script.onerror = function(){
      if(done) return;
      done = true; clearTimeout(timer); cleanup();
      reject(new Error("We couldn't reach the BRYC server."));
    };
    document.body.appendChild(script);
  });
}

/* ===========================================================================
 * SESSION
 * ======================================================================== */

function setToken(t){
  token = t || "";
  if(token) sessionStorage.setItem("bryc_portal_token", token);
  else sessionStorage.removeItem("bryc_portal_token");
}

function armIdleTimers(){
  clearIdleTimers();
  warnTimer = setTimeout(function(){
    noticeMsg = "You'll be signed out in 2 minutes for security. Move your mouse or tap the page to stay signed in.";
    render();
  }, IDLE_SIGNOUT_MS - IDLE_WARNING_MS);
  idleTimer = setTimeout(function(){
    signOut("You were signed out automatically after 30 minutes of inactivity.");
  }, IDLE_SIGNOUT_MS);
}

function clearIdleTimers(){
  if(idleTimer) clearTimeout(idleTimer);
  if(warnTimer) clearTimeout(warnTimer);
  idleTimer = null; warnTimer = null;
}

function bumpIdle(){
  if(view !== "dashboard") return;
  const hadWarning = noticeMsg.indexOf("signed out in 2 minutes") > -1;
  if(hadWarning){ noticeMsg = ""; render(); }
  armIdleTimers();
}

function signOut(message){
  const old = token;
  clearIdleTimers();
  setToken("");
  data = null; pinValue = ""; openReq = -1;
  errorMsg = ""; noticeMsg = message || "";
  view = "email";
  render();
  // Best-effort server-side revoke; the local sign-out already happened.
  if(old) jsonpFetch({ action: "signOut", token: old }).catch(function(){});
}

/* ===========================================================================
 * ACTIONS
 * ======================================================================== */

function requestPin(){
  const email = (emailValue || "").trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
    errorMsg = "Please enter a valid email address.";
    render();
    return;
  }
  busy = true; errorMsg = ""; noticeMsg = ""; render();

  jsonpFetch({ action: "requestPin", email: email }).then(function(res){
    busy = false;
    if(res.status === "ok"){
      emailValue = email;
      pinValue = "";
      noticeMsg = res.message || "";
      view = "pin";
    } else {
      errorMsg = res.message || "We couldn't send a code right now. Please try again.";
    }
    render();
  }).catch(function(err){
    busy = false;
    errorMsg = err.message || "Something went wrong. Please try again.";
    render();
  });
}

function verifyPin(){
  const pin = (pinValue || "").trim();
  if(!/^\d{6}$/.test(pin)){
    errorMsg = "Enter the 6-digit code from your email.";
    render();
    return;
  }
  busy = true; errorMsg = ""; noticeMsg = ""; render();

  jsonpFetch({ action: "verifyPin", email: emailValue, pin: pin }).then(function(res){
    busy = false;
    if(res.status === "ok" && res.token){
      setToken(res.token);
      pinValue = "";
      loadPortal();
    } else {
      pinValue = "";
      errorMsg = res.message || "That code isn't right. Please try again.";
      render();
    }
  }).catch(function(err){
    busy = false;
    errorMsg = err.message || "Something went wrong. Please try again.";
    render();
  });
}

function loadPortal(){
  view = "loading"; errorMsg = ""; render();

  jsonpFetch({ action: "portal", token: token }).then(function(res){
    if(res.status === "ok"){
      data = res;
      view = "dashboard";
      noticeMsg = "";
      armIdleTimers();
    } else if(res.status === "unauthorized"){
      setToken("");
      data = null;
      view = "email";
      noticeMsg = "Your session expired. Sign in again to see your information.";
    } else {
      setToken("");
      view = "email";
      errorMsg = res.message || "We couldn't load your information. Please sign in again.";
    }
    render();
  }).catch(function(err){
    view = "email";
    setToken("");
    errorMsg = err.message || "We couldn't load your information.";
    render();
  });
}

function escapeHtml(str){
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/** "senior funds request" -> "Senior funds request", for use as a card title. */
function sentenceCase(str){
  const t = String(str || "").trim();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
}

function money(n){
  const v = Number(n) || 0;
  return "$" + v.toFixed(2);
}

function messagesHtml(){
  let h = "";
  if(errorMsg) h += '<div class="msg msg-error">' + escapeHtml(errorMsg) + "</div>";
  if(noticeMsg) h += '<div class="msg msg-info">' + escapeHtml(noticeMsg) + "</div>";
  return h;
}

function brandHtml(){
  return '<div class="brand"><img class="brand-logo" src="' + LOGO_SRC + '" alt="BRYC" /></div>';
}

/**
 * Firebase is only fetched when a counselor actually opens the dashboard --
 * students never download it. Boots the dashboard once the SDK is in.
 */
let staffLoading = false, staffReady = false;
function openStaff(){
  if(staffReady || staffLoading) return;
  staffLoading = true;

  const SDK = [
    "https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js",
    "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"
  ];
  const load = function(i){
    if(i >= SDK.length){
      staffLoading = false;
      staffReady = true;
      if(typeof window.__staffBoot === "function") window.__staffBoot();
      return;
    }
    const el = document.createElement("script");
    el.src = SDK[i];
    el.onload = function(){ load(i + 1); };
    el.onerror = function(){
      staffLoading = false;
      const err = document.getElementById("auth-error");
      if(err){
        err.textContent = "Couldn't load Google sign-in. Check your connection and reload.";
        err.style.display = "block";
      }
    };
    document.head.appendChild(el);
  };
  load(0);
}

 * iframe -- this page is a different origin and cannot read anything the
 * student types. No sign-in needed, which matters: a senior who has never
 * submitted a request has no way to sign in yet.
 */
function requestHtml(){

function render(){
  const root = document.getElementById("root");
  const staff = document.getElementById("staff");

  if(mode === "staff"){
    root.className = "wrap";
    root.innerHTML = brandHtml() + modeTabsHtml();
    wireUp();
    staff.style.display = "block";
    openStaff();
    return;
  }
  staff.style.display = "none";

  if(mode === "request"){
    root.className = "wrap";
    root.innerHTML = requestHtml();
    wireUp();
    return;
  }

  root.className = view === "dashboard" ? "wrap wide" : "wrap";

  if(view === "dashboard") root.innerHTML = dashboardHtml();
  else if(view === "loading") root.innerHTML = loadingHtml();
  else if(view === "pin") root.innerHTML = pinHtml();
  else root.innerHTML = emailHtml();

  wireUp();
}

function fundsPanelHtml(d){
  let h = '<div class="panel"><div class="panel-title">My Senior Funds</div>';

  if(!d.funds){
    h += '<div class="empty">Your senior funds haven\'t been set up in the tracker yet. '
      + "Once your BRYC counselor adds you, your balance will show up here automatically.</div>";
    return h + "</div>";
  }

  const f = d.funds;
  const pct = f.startingFunds > 0
    ? Math.max(0, Math.min(100, Math.round((f.remainingFunds / f.startingFunds) * 100)))
    : 0;

  h += '<div class="funds-numbers"><span class="big">' + money(f.remainingFunds) + "</span>"
    +  '<span class="lbl">remaining of ' + money(f.startingFunds)
    +  (f.additionalFunds ? " (includes " + money(f.additionalFunds) + " added by BRYC)" : "")
    +  "</span></div>"
    +  '<div class="funds-bar-track"><div class="funds-bar-fill" style="width:' + pct + '%;"></div></div>'
    +  '<div class="funds-caption">' + money(f.totalSpent) + " spent so far this year</div>";

  // A negative balance is real on this sheet -- say so rather than showing an
  // empty bar and letting them assume they still have room.
  if(f.remainingFunds < 0){
    h += '<div class="status-box status-warn" style="margin-top:12px;">You\'ve gone over your senior funds by '
      + money(Math.abs(f.remainingFunds)) + ". Talk to your BRYC counselor about what happens next.</div>";
  }

  h += '<div class="panel-title" style="margin-top:22px;">What you\'ve spent it on</div>';
  if(f.spending && f.spending.length){
    h += f.spending.map(function(s){
      return '<div class="spend-row"><div>'
        + '<div class="sr-desc">' + escapeHtml(s.description || "Senior funds expense") + "</div>"
        + '<div class="sr-date">' + escapeHtml(s.date || "") + "</div></div>"
        + '<div class="sr-amt">' + money(s.amount) + "</div></div>";
    }).join("");
  } else {
    h += '<div class="empty">Nothing has been spent from your senior funds yet. '
      + "Approved requests show up here once BRYC pays them.</div>";
  }

  return h + "</div>";
}

function attendancePanelHtml(d){
  let h = '<div class="panel"><div class="panel-title">Attendance</div>';
  const a = d.attendance;

  if(!a){
    h += '<div class="status-box status-pending">Your attendance hasn\'t been recorded yet. '
      + "It updates weekly once sessions begin.</div>";
    return h + "</div>";
  }

  // Fallback shape: no live percentage, just the old hand-entered absence count.
  if(a.percent === null || a.percent === undefined){
    const okAbs = a.meetsRequirement;
    h += '<div class="status-box ' + (okAbs ? "status-ok" : "status-warn") + '">'
      + "<b>" + a.absent + " absence" + (a.absent === 1 ? "" : "s") + "</b> out of " + a.maxAllowed + " allowed."
      + (okAbs ? " You're meeting the attendance requirement for senior funds."
               : " This is above the allowed limit &mdash; talk to your counselor about your senior funds eligibility.")
      + (a.note ? '<div style="margin-top:6px;">' + escapeHtml(a.note) + "</div>" : "")
      + "</div>";
    return h + "</div>";
  }

  const pct = Math.max(0, Math.min(100, a.percent));
  h += '<div class="funds-numbers"><span class="big">' + a.percent + '%</span>'
    +  '<span class="lbl">attendance so far</span></div>'
    +  '<div class="funds-bar-track"><div class="funds-bar-fill" style="width:' + pct + '%;"></div></div>';

  const bits = [];
  if(a.present) bits.push(a.present + " present");
  if(a.absent) bits.push(a.absent + " absent");
  if(a.halfPresent) bits.push(a.halfPresent + " half day" + (a.halfPresent === 1 ? "" : "s"));
  h += '<div class="funds-caption">'
    + (bits.length ? escapeHtml(bits.join(" &middot; ").replace(/&middot;/g, "\u00b7")) : "No sessions recorded yet")
    + (a.asOf ? " &middot; through " + escapeHtml(a.asOf) : "")
    + "</div>";

  // Name the sessions they missed, so "you're below 80%" is actionable.
  const missed = (a.absentSessions || []).concat((a.halfSessions || []).map(function(x){ return x + " (half day)"; }));
  if(missed.length){
    h += '<div class="missed"><div class="missed-hdr">Sessions you missed</div>'
      + missed.map(function(m){ return '<span class="missed-chip">' + escapeHtml(m) + "</span>"; }).join("")
      + "</div>";
  }

  h += '<div class="status-box ' + (a.meetsRequirement ? "status-ok" : "status-warn") + '" style="margin-top:14px;">'
    + (a.meetsRequirement
        ? "You're above the " + a.minPercent + "% attendance requirement, so you're eligible to use your senior funds."
        : "You're below the " + a.minPercent + "% attendance requirement. Talk to your counselor &mdash; this can affect whether you can use your senior funds.")
    + (a.note ? '<div style="margin-top:6px;">' + escapeHtml(a.note) + "</div>" : "")
    + "</div>";

  return h + "</div>";
}

/* ---------------------- request progress + guidance ---------------------- */

const CANONICAL_STAGES = ["Received", "In review", "Approved", "Complete"];

function trailHtml(r){
  // The final step reads "Paid" for the requests BRYC actually pays money for,
  // and "Complete" for everything else.
  const labels = ["Received", "In review", "Approved", r.isPayment ? "Paid" : "Complete"];
  const at = Math.max(0, CANONICAL_STAGES.indexOf(r.stage));
  const last = labels.length - 1;

  return '<div class="trail">' + labels.map(function(label, i){
    let cls = "";
    if(i < at) cls = "done";
    else if(i === at) cls = (at === last) ? "done" : "current";
    return '<div class="trail-node ' + cls + '"><span class="dot"></span>'
      + '<span class="lbl">' + escapeHtml(label) + "</span></div>";
  }).join("") + "</div>";
}

function nextStepFor(r){
  const t = String(r.type || "");
  if(t.indexOf("senior funds") > -1){
    return r.isPayment
      ? "You don't pay anything yourself. Once BRYC approves this, we pay the fee directly and it comes out of your senior funds. Make sure any login you gave us still works."
      : "Your counselor will process your fee waiver through your partner school. Watch your email in case they need anything else from you.";
  }
  if(t.indexOf("writing coach") > -1) return "Rachel will email you to set up a time. Have your draft shared and ready before your session.";
  if(t.indexOf("College Aid Pro") > -1) return "Your setup instructions were emailed to you as soon as you submitted this. Follow the link in that email to create your free premium account.";
  if(t.indexOf("UWorld") > -1) return "Aareena will email your UWorld account details once your account is set up.";
  if(t.indexOf("MasteryPrep") > -1) return "Aareena will email your MasteryPrep login once it's set up.";
  return "Your BRYC counselor or advisor will follow up with you by email.";
}

function requestsPanelHtml(d){
  const reqs = d.requests || [];
  const done = reqs.filter(function(r){ return r.fulfilled; }).length;

  let h = '<div class="panel"><div class="panel-head">'
    + '<div class="panel-title">My Requests'
    + (reqs.length ? " &mdash; " + done + " of " + reqs.length + " fulfilled" : "")
    + "</div><span class=\"spacer\"></span>"
    + '<a class="newreq" href="' + REQUEST_FORM_URL + '" target="_blank" rel="noopener noreferrer">Submit a new request</a>'
    + "</div>";

  if(!reqs.length){
    h += '<div class="empty">You haven\'t submitted a BRYC support request yet. '
      + "Once you do, you'll be able to track it right here.</div>";
    return h + "</div>";
  }

  h += reqs.map(function(r, i){
    const open = openReq === i;
    const complete = r.stage === "Complete" || r.fulfilled;
    return '<div class="req-card' + (open ? " open" : "") + '">'
      + '<div class="req-head" data-req="' + i + '">'
      +   '<div class="txt"><div class="req-type">' + escapeHtml(sentenceCase(r.friendlyType || r.type)) + "</div>"
      +   '<div class="req-date">Received ' + escapeHtml(r.submittedLong || r.submitted || "recently") + "</div></div>"
      +   '<span class="pill ' + (complete ? "pill-ok" : "pill-pending") + '">'
      +     escapeHtml(complete ? (r.isPayment ? "Paid" : "Fulfilled") : r.stage) + "</span>"
      +   '<span class="chev">&#9660;</span>'
      + "</div>"
      + (open ? '<div class="req-body">' + requestBodyHtml(r) + "</div>" : "")
      + "</div>";
  }).join("");

  return h + "</div>";

function requestBodyHtml(r){
  const complete = r.stage === "Complete" || r.fulfilled;
  let h = trailHtml(r);

  if(!complete){
    h += '<div class="turnaround">' + escapeHtml(TURNAROUND_REVIEW)
      + (r.isPayment ? " " + escapeHtml(TURNAROUND_PAYMENT) : "") + "</div>";
  }

  // A note your counselor wrote specifically for you to read.
  if(r.message){
    h += '<div class="from-counselor"><div class="hdr">Note from your BRYC counselor</div>'
      + '<div class="body">' + escapeHtml(r.message) + "</div></div>";
  }

  h += '<div class="next-step"><b>' + (complete ? "All done" : "What happens next") + "</b>"
    + (complete
        ? (r.isPayment
            ? "BRYC has paid this fee and it's reflected in your senior funds balance above."
            : "This request has been taken care of. Reach out to your counselor if you need anything else.")
        : escapeHtml(nextStepFor(r)))
    + "</div>";

  h += detailsHtml(r);
  return h;
}

function detailsHtml(r){
  const details = r.details || [];
  if(!details.length) return "";
  return '<div class="panel-title" style="margin:18px 0 4px;">What you submitted</div>'
    + details.map(function(x){
        return '<div class="detail-row"><div class="dl">' + escapeHtml(x.label) + "</div>"
          + '<div class="dv">' + escapeHtml(x.value) + "</div></div>";
      }).join("");
}

function doSignIn(){

  provider.addScope(SHEETS_SCOPE);
  provider.setCustomParameters({ prompt: "select_account" });
  document.getElementById("auth-error").style.display = "none";
  auth.signInWithPopup(provider).then(function(result){
    const email = (result.user.email || "").toLowerCase();
    if(!email.endsWith("@" + ADMIN_EMAIL_DOMAIN)){
      auth.signOut();
      showAccessDenied();
      return;
    }
    // Getting the Sheets access token out of the sign-in result is version
    // dependent: the compat SDK resolves with {user, credential, ...} while the
    // static credentialFromResult() is the modular implementation and returns
    // null when handed a compat result. Take whichever actually yields a token.
    let cred = null;
    try {
      if(typeof firebase.auth.GoogleAuthProvider.credentialFromResult === "function"){
        cred = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
      }
    } catch(e){ cred = null; }
    if(!cred || !cred.accessToken) cred = result.credential || null;
    if((!cred || !cred.accessToken) && result.additionalUserInfo){
      cred = result.additionalUserInfo.credential || cred;
    }
    accessToken = cred && (cred.accessToken || cred.oauthAccessToken);

    // Without it every Sheets call fails with "invalid authentication
    // credentials", which reads like a bug in the page rather than a missing
    // permission. Say so plainly instead.
    if(!accessToken){
      auth.signOut();
      const box = document.getElementById("auth-error");
      box.textContent = "Signed in, but Google didn't grant permission to read the spreadsheets. "
        + "Sign in again and make sure you allow spreadsheet access.";
      box.style.display = "block";
      return;
    }

    userEmail = email;
    onSignedIn();
  }).catch(function(err){
    const box = document.getElementById("auth-error");
    box.textContent = "Sign-in failed: " + (err && err.message ? err.message : "please try again.");
    box.style.display = "block";
  });
}

  return fetch(url, {

  }).then(function(res){
    if(!res.ok) return res.json().then(function(b){ throw new Error(apiError(res, b)); });
    return res.json();
  });
}

/**
 * A1 notation with the sheet name properly quoted.
 *
 * Google REQUIRES single quotes around a sheet name containing a space --
 * "Form Responses!A1:BZ" is rejected, "'Form Responses'!A1:BZ" works. Every tab
 * this dashboard touches has a space in its name ("Form Responses",
 * "Fee Payment Balance", "Grade 12"), so every range must go through here.
 */
/**
 * Turns a Sheets API failure into something a counselor can act on. A 401 means
 * the hour-long Google token has expired, which is not a spreadsheet problem
 * and shouldn't be reported as one.
 */
function apiError(res, body){
  if(res.status === 401) return "Your Google sign-in expired. Click Sign out, then sign in again.";
  if(res.status === 403) return "Your account doesn't have access to that spreadsheet. Ask for Editor access to the tracker.";
  const msg = body && body.error && body.error.message ? body.error.message : ("HTTP " + res.status);
  return msg;
}

function a1(sheet, range){

}

/** 0-based column index -> A1 letters (handles AA, AB, ...). */
function colLetter(i){
  let s = "", n = i;
  while(n >= 0){ s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; }
  return s;
}

/**
 * Fire-and-forget call into the Apps Script Web App to email a student. The
 * script re-verifies this counselor's Google identity before sending.
 */
function notifyStudent(sheetRow, kind){
  if(!emailStudents) return Promise.resolve(null);
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) return Promise.resolve(null);
  return new Promise(function(resolve){
    const cb = "bryc_notify_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
    const script = document.createElement("script");
    let done = false;
    const cleanup = function(){
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(function(){ if(!done){ done = true; cleanup(); resolve(null); } }, 15000);
    window[cb] = function(res){ if(!done){ done = true; clearTimeout(timer); cleanup(); resolve(res); } };
    script.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?") > -1 ? "&" : "?")
      + "action=notifyStudent&kind=" + encodeURIComponent(kind)
      + "&row=" + encodeURIComponent(sheetRow)
      + "&adminToken=" + encodeURIComponent(accessToken)
      + "&callback=" + cb;
    script.onerror = function(){ if(!done){ done = true; clearTimeout(timer); cleanup(); resolve(null); } };
    document.body.appendChild(script);
  });
}
