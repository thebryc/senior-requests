 */
function parseFeeLayout(headers){
  const norm = headers.map(normHeader);
  const layout = {
    name: norm.indexOf("fellow name"),
    email: norm.indexOf("email"),
    starting: norm.indexOf("starting balance"),
    additional: norm.indexOf("additional funds"),
    total: norm.indexOf("total"),
    current: norm.indexOf("current balance"),
    width: headers.length,
    triplets: []
  };
  for(let i = 0; i < norm.length; i++){
    if(norm[i] !== "type of fee") continue;
    layout.triplets.push({
      type: i,
      amount: norm[i+1] === "amount" ? i+1 : -1,
      date: norm[i+2] === "date paid" ? i+2 : -1
    });
  }
  return layout;
}

function parseFeeRows(rows){
  if(!rows || rows.length < 2){ feeLayout = rows && rows.length ? parseFeeLayout(rows[0]) : null; return []; }
  feeLayout = parseFeeLayout(rows[0]);
  if(feeLayout.name === -1) return [];
  return rows.slice(1).map(function(row, i){
    const sheetStarting = money(row[feeLayout.starting]);   // stale $100; kept only to warn
    const additional = feeLayout.additional > -1 ? (money(row[feeLayout.additional]) || 0) : 0;
    let spent = 0, used = 0;
    feeLayout.triplets.forEach(function(t){
      const amt = t.amount > -1 ? money(row[t.amount]) : null;
      const type = String(row[t.type] || "").trim();
      if(type || amt !== null){ used++; if(amt !== null) spent += amt; }
    });
    const start = DEFAULT_STARTING_FUNDS + additional;
    return {
      sheetRow: i + 2,
      name: String(row[feeLayout.name] || "").trim(),
      email: feeLayout.email > -1 ? String(row[feeLayout.email] || "").trim().toLowerCase() : "",
      startingFunds: start,
      spent: spent,
      remaining: start - spent,
      usedTriplets: used,
      // Flags rows still carrying last year's figure, so it can be surfaced.
      sheetStartingStale: sheetStarting !== null && sheetStarting !== DEFAULT_STARTING_FUNDS
    };
  }).filter(function(f){ return f.name; });
}

/** The Fee Payment Balance row for whoever made this request. */
function feeRowFor(r){
  const email = String(r.email || "").trim().toLowerCase();
  const key = nameKey(r.name);
  return (email && feeRows.find(function(f){ return f.email === email; }))
      || feeRows.find(function(f){ return nameKey(f.name) === key; })
      || null;
}
function remainingFor(r){
  const f = feeRowFor(r);
  return f ? f.remaining : null;
}

/**
 * Adds an "Email" column to Fee Payment Balance if it's missing, then fills in
 * any blank ones by matching Fellow Name against the names on submitted
 * requests. Anything ambiguous is left blank rather than guessed.
 */
function backfillFeeEmails(){
  if(!feeLayout || feeLayout.name === -1) return Promise.resolve(0);

  const ensure = feeLayout.email > -1
    ? Promise.resolve()
    : sheetsUpdate(a1(FEE_BALANCE_SHEET, colLetter(feeLayout.width) + "1"), [["Email"]]).then(function(){
        feeLayout.email = feeLayout.width;
        feeLayout.width += 1;
        feeRows.forEach(function(f){ f.email = ""; });
      });

  return ensure.then(function(){
    // name -> the single email that name maps to; ambiguous names are dropped.
    const byName = {};
    responses.forEach(function(r){
      const k = nameKey(r.name);
      const e = String(r.email || "").trim().toLowerCase();
      if(!k || !e) return;
      if(byName[k] === undefined) byName[k] = e;
      else if(byName[k] !== e) byName[k] = null;   // same name, two emails -> don't guess
    });

    const writes = [];
    feeRows.forEach(function(f){
      if(f.email) return;
      const e = byName[nameKey(f.name)];
      if(!e) return;
      f.email = e;
      writes.push({ range: a1(FEE_BALANCE_SHEET, colLetter(feeLayout.email) + f.sheetRow), values: [[e]] });
    });
    if(!writes.length) return 0;

    const url = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "/values:batchUpdate";
    return fetch(url, {
      method: "POST",
      headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
      body: JSON.stringify({ valueInputOption: "USER_ENTERED", data: writes })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(b){ throw new Error(apiError(res, b)); });
      return writes.length;
    });
  });
}

/**
 * Records a payment in the fellow's next free triplet. Never overwrites an
 * existing entry and never touches the Current Balance formula.
 */
function logPayment(r, amount, description){
  const f = feeRowFor(r);
  if(!f) return Promise.reject(new Error("No Fee Payment Balance row for " + (r.name || "this fellow") + " — add one, then save again."));
  if(!feeLayout || !feeLayout.triplets.length) return Promise.reject(new Error("Couldn't find the Type of Fee / Amount / Date Paid columns."));

  const slot = feeLayout.triplets[f.usedTriplets];
  if(!slot) return Promise.reject(new Error(f.name + " has used every payment slot on the sheet — add another Type of Fee / Amount / Date Paid group."));
  if(slot.amount === -1 || slot.date === -1) return Promise.reject(new Error("That payment slot is missing its Amount or Date Paid column."));

  const today = new Date();
  const dateStr = (today.getMonth() + 1) + "/" + today.getDate() + "/" + today.getFullYear();
  const range = a1(FEE_BALANCE_SHEET, colLetter(slot.type) + f.sheetRow + ":" + colLetter(slot.date) + f.sheetRow);

  return sheetsUpdate(range, [[description, amount, dateStr]]).then(function(){
    f.usedTriplets += 1;
    f.spent += amount;
    f.remaining -= amount;
    return f;
  });
}

/* ===================== ROSTER (attendance sheet) ===================== */
/**
 * The attendance tab doubles as the senior roster. Names are split across
 * First Name / Last Name there, while everything else here uses one field.
 */
function parseRoster(rows){
  if(!rows || rows.length < ATTENDANCE_HEADER_ROW) return [];
  const headers = (rows[ATTENDANCE_HEADER_ROW - 1] || []).map(normHeader);
  const firstIdx = headers.indexOf("first name");
  const lastIdx = headers.indexOf("last name");
  const totalIdx = headers.indexOf("total %");
  if(firstIdx === -1 || lastIdx === -1) return [];

  const out = [];
  const seen = new Set();
  for(let r = ATTENDANCE_HEADER_ROW; r < rows.length; r++){
    const row = rows[r] || [];
    const name = String(row[firstIdx] || "").trim() + " " + String(row[lastIdx] || "").trim();
    const key = nameKey(name);
    if(!key || seen.has(key)) continue;
    seen.add(key);
    let pct = totalIdx > -1 ? row[totalIdx] : "";
    if(typeof pct === "string" && pct.indexOf("%") > -1) pct = parseFloat(pct);
    else if(typeof pct === "number" && pct <= 1) pct = pct * 100;
    else pct = (pct === "" || pct === null || pct === undefined) ? null : Number(pct);
    out.push({ name: name.trim(), key: key, percent: (pct === null || isNaN(pct)) ? null : Math.round(pct * 10) / 10 });
  }
  return out;
}

/**
 * Every senior on the roster gets a Fee Payment Balance row, created here so a
 * new Fellow's funds are ready before they ever submit anything.
 *
 * Only Fellow Name / Starting Balance / Email are written. The Total and
 * Current Balance columns are BRYC's own formulas and are deliberately left
 * alone -- the portal computes a correct balance from Starting minus payments
 * when Current Balance is blank, so nothing is wrong in the meantime, but the
 * formulas will want filling down for the sheet itself to look right.
 */
function provisionRosterFunds(){
  if(!feeLayout || feeLayout.name === -1 || !roster.length) return Promise.resolve(0);

  const have = new Set(feeRows.map(function(f){ return nameKey(f.name); }));
  const missing = roster.filter(function(p){ return !have.has(p.key); });
  if(!missing.length) return Promise.resolve(0);

  // Email if we can get it from their own request rows; blank rather than guessed.
  const byName = {};
  responses.forEach(function(r){
    const k = nameKey(r.name), e = String(r.email || "").trim().toLowerCase();
    if(!k || !e) return;
    if(byName[k] === undefined) byName[k] = e;
    else if(byName[k] !== e) byName[k] = null;
  });

  const width = feeLayout.width;
  const rows = missing.map(function(p){
    const row = new Array(width).fill("");
    row[feeLayout.name] = p.name;
    if(feeLayout.starting > -1) row[feeLayout.starting] = DEFAULT_STARTING_FUNDS;
    if(feeLayout.email > -1 && byName[p.key]) row[feeLayout.email] = byName[p.key];
    return row;
  });

  const url = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "/values/"
    + encodeURIComponent(a1(FEE_BALANCE_SHEET, "A:" + colLetter(width - 1)))
    + ":append?valueInputOption=USER_ENTERED";
  return fetch(url, {
    method: "POST",
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
    body: JSON.stringify({ values: rows })
  }).then(function(res){
    if(!res.ok) return res.json().then(function(b){ throw new Error(apiError(res, b)); });
    missing.forEach(function(p){
      feeRows.push({ sheetRow: -1, name: p.name, email: byName[p.key] || "",
                     startingFunds: DEFAULT_STARTING_FUNDS, spent: 0,
                     remaining: DEFAULT_STARTING_FUNDS, usedTriplets: 0 });
    });
    return missing.length;
  });
}

/** Roster seniors who have never submitted a request. */
function computeRosterOnly(){
  const requested = new Set(responses.map(function(r){ return nameKey(r.name); }).filter(Boolean));
  rosterOnly = roster.filter(function(p){ return !requested.has(p.key); }).map(function(p){
    const f = feeRows.find(function(x){ return nameKey(x.name) === p.key; });
    return { rosterOnly: true, name: p.name, key: p.key, percent: p.percent,
             remaining: f ? f.remaining : null, spent: f ? f.spent : null };
  });
}

/* ===================== DATA LOAD ===================== */
function loadData(){
  document.getElementById("list").innerHTML = `<div class="empty-state">Loading responses…</div>`;
  Promise.all([
    sheetsGet(a1(SHEET_NAME, "A1:BZ")),
    sheetsGet(a1(FEE_BALANCE_SHEET, "A1:BZ")).catch(function(){ return []; }),
    // The attendance workbook doubles as the senior roster.
    sheetsGetFrom(ATTENDANCE_SHEET_ID, a1(ATTENDANCE_TAB, "A1:BZ")).catch(function(){ return []; })
  ]).then(function(results){
    return ensureTrackingColumns(results[0]).then(function(rows){
      colMap = rows.length ? resolveColumns(rows[0]) : {};
      responses = rows.slice(1)
        .map(function(row, i){ return rowToResponse(row, i + 2); })  // header is row 1
        .filter(function(r){ return r.name || r.email; });           // skip blank rows
      feeRows = parseFeeRows(results[1]);
      roster = parseRoster(results[2]);
      computeRosterOnly();
      applyCounselorDefault();

      renderFilterTabs();
      render();

      // Give every senior on the roster a funds row, then fill in the Email
      // column so a signed-in senior resolves to their row exactly.
      return provisionRosterFunds().then(function(added){
        if(added){
          showToast("Added " + added + " fellow" + (added === 1 ? "" : "s") + " from the attendance roster to Fee Payment Balance. "
            + "Fill the Total / Current Balance formulas down to the new rows.");
        }
        return backfillFeeEmails();
      }).then(function(n){
        if(n) showToast("Filled in " + n + " email" + (n === 1 ? "" : "s") + " on Fee Payment Balance.");
        computeRosterOnly();
        render();
      }).catch(function(err){
        showToast("Roster sync: " + err.message);
      });
    });
  }).catch(function(err){
    // Only suggest checking tab names when the failure actually looks like a
    // naming/range problem -- offering it after a sign-in failure sends people
    // hunting through the spreadsheet for a fault that isn't there.
    const m = err.message || "";
    const nameProblem = /Unable to parse range|not found|Requested entity/i.test(m);
    document.getElementById("list").innerHTML =
      `<div class="empty-state">Couldn't load data: ${escapeHtml(m)}` +
      (nameProblem
        ? `<br/>Check that the tabs are named "${escapeHtml(SHEET_NAME)}" and "${escapeHtml(FEE_BALANCE_SHEET)}".`
        : "") +
      `</div>`;
  });
}

/**
 * Appends this dashboard's tracking columns after whatever the form produced,
 * so nobody has to add them by hand. They go at the first free column, which
 * keeps them correct even if the form gains questions later.
 */
function ensureTrackingColumns(rows){
  const header = (rows[0] || []).slice();
  const norm = header.map(normHeader);
  const missing = TRACKING_COLUMNS.filter(function(c){ return norm.indexOf(c.toLowerCase()) === -1; });
  if(!missing.length) return Promise.resolve(rows);

  const startIdx = header.length;
  const merged = header.concat(missing);
  const range = a1(SHEET_NAME, colLetter(startIdx) + "1:" + colLetter(merged.length - 1) + "1");
  return sheetsUpdate(range, [missing]).then(function(){
    rows[0] = merged;
    return rows;
  });
}

function rowToResponse(row, sheetRow){
  const r = { sheetRow: sheetRow, timestamp: row[0] || "" };
  RESPONSE_FIELDS.forEach(function(f){
    const i = colMap[f.k];
    r[f.k] = (i === undefined || row[i] === undefined || row[i] === null) ? "" : row[i];
  });
  const g = function(name){
    const i = colMap["_" + name.replace(/\s+/g, "")];
    return (i === undefined || row[i] === undefined) ? "" : row[i];
  };
  r.fulfilled = String(g("Fulfilled") || "").toUpperCase() === "TRUE";
  r.notes = g("Notes") || "";
  const rawStage = String(g("Stage") || "").trim();
  r.stage = STAGES.indexOf(rawStage) > -1 ? rawStage : (r.fulfilled ? "Complete" : "Received");
  r.messageToStudent = g("Message to Student") || "";
  return r;
}

/** A1 range covering this row's four tracking columns, wherever they landed. */
function trackingRange(sheetRow){
  const first = colMap["_Fulfilled"];
  const last = colMap["_MessagetoStudent"];
  if(first === undefined || last === undefined) return null;
  return a1(SHEET_NAME, colLetter(first) + sheetRow + ":" + colLetter(last) + sheetRow);
}

/* ===================== RENDER ===================== */
function renderFilterTabs(){
  const el = document.getElementById("filter-tabs");
  el.innerHTML = FILTERS.map(function(f){
    const count = f.key === "all" ? responses.length : responses.filter(function(r){ return filterKeyOf(r) === f.key; }).length;
    return `<button class="filter-tab${f.key === activeFilter ? " active" : ""}" data-filter="${f.key}">${f.label} (${count})</button>`;
  }).join("");
  el.querySelectorAll(".filter-tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      activeFilter = btn.getAttribute("data-filter");
      renderFilterTabs();
      render();
    });
  });
}

function visibleList(){
  let list = responses.slice().reverse(); // newest first
  if(activeFilter !== "all") list = list.filter(function(r){ return filterKeyOf(r) === activeFilter; });
  if(unfulfilledOnly) list = list.filter(function(r){ return !r.fulfilled; });
  if(mineOnly){
    const mine = counselorLabelFor(userEmail);
    if(mine) list = list.filter(function(r){ return String(r.counselor || "").trim() === mine; });
  }
  if(searchTerm){
    const q = searchTerm.toLowerCase();
    list = list.filter(function(r){
      return (r.name || "").toLowerCase().indexOf(q) !== -1
          || (r.email || "").toLowerCase().indexOf(q) !== -1;
    });
  }
  // Money due soonest first -- a deposit due Friday outranks an older request
  // with no deadline at all. Requests without a deadline fall to the back,
  // ordered by how long they've been waiting.
  if(viewMode === "queue"){
    list.sort(function(a, b){
      const da = daysUntilDeadline(a), db = daysUntilDeadline(b);
      if(da !== null && db !== null) return da - db;
      if(da !== null) return -1;
      if(db !== null) return 1;
      return (ageInDays(b) || 0) - (ageInDays(a) || 0);
    });
  }

  return list;
}

/* ---------- cohort summary ---------- */
function renderSummary(){
  const el = document.getElementById("summary");

  // Scope the strip exactly like the list, so the numbers always describe
  // what's on screen. Untick "only my students" for the cohort view.
  const mine = mineOnly ? counselorLabelFor(userEmail) : null;
  const scoped = mine
    ? responses.filter(function(r){ return String(r.counselor || "").trim() === mine; })
    : responses;

  const scopedKeys = new Set();
  scoped.forEach(function(r){
    const e = String(r.email || "").trim().toLowerCase();
    const n = nameKey(r.name);
    if(e) scopedKeys.add(e);
    if(n) scopedKeys.add(n);
  });
  const scopedFellows = mine
    ? feeRows.filter(function(f){ return scopedKeys.has(f.email) || scopedKeys.has(nameKey(f.name)); })
    : feeRows;

  const outstanding = scoped.filter(function(r){ return !r.fulfilled; });
  const dueSoon = outstanding.filter(function(r){
    const d = daysUntilDeadline(r);
    return d !== null && d <= STALE_DAYS;
  });
  const seniors = new Set(scoped.map(function(r){ return (r.email || r.name || "").toLowerCase(); }).filter(Boolean));

  const untouched = scopedFellows.filter(function(f){ return f.spent === 0; }).length;
  const spent = scopedFellows.reduce(function(sum, f){ return sum + f.spent; }, 0);
  const overdrawn = scopedFellows.filter(function(f){ return f.remaining < 0; }).length;

  const stats = [
    { n: outstanding.length, l: "Outstanding requests" },
    { n: dueSoon.length, l: "Money due within " + STALE_DAYS + " days", alert: dueSoon.length > 0 },
    { n: seniors.size, l: "Seniors who've requested" },
    { n: rosterOnly.length, l: "On roster, never requested" },
    { n: overdrawn, l: "Fellows over their balance", alert: overdrawn > 0 },
    { n: "$" + spent.toFixed(0), l: "Spent from senior funds" }
  ];

  el.innerHTML = stats.map(function(s){
    return '<div class="stat' + (s.alert ? " alert" : "") + '"><div class="n">' + s.n + "</div>"
      + '<div class="l">' + s.l + "</div></div>";
  }).join("");
}

function render(){
  renderSummary();
  const list = visibleList();
  document.getElementById("count-note").textContent = list.length + " request" + (list.length === 1 ? "" : "s");

  const container = document.getElementById("list");
  if(!list.length){
    container.innerHTML = '<div class="empty-state">Nothing here. ' +
      (unfulfilledOnly ? "Everything in this filter is fulfilled." : "No requests match this view.") + "</div>";
    return;
  }

  container.className = viewMode === "queue" ? "queue" : "list";
  let html;
  try {
    html = list.map(viewMode === "queue" ? queueRowHtml : cardHtml).join("");
  } catch(err){
    // Surface it rather than silently leaving the previous list on screen,
    // which makes every button look broken.
    container.innerHTML = '<div class="empty-state">Something went wrong drawing the list: '
      + escapeHtml(err.message) + '<br/>Reload the page; if it persists, send this message on.</div>';
    return;
  }

  // Seniors on the attendance roster who have never submitted anything. They
  // sit below the real queue -- nothing to action, but easy to spot and chase.
  if(viewMode === "queue" && !searchTerm){
    const idle = visibleRosterOnly();
    if(idle.length){
      html += '<div class="roster-head">On the roster, no requests yet &mdash; ' + idle.length + "</div>"
        + idle.map(rosterRowHtml).join("");
    }
  }
  container.innerHTML = html;
  viewMode === "queue" ? wireQueue(container) : wireCards(container);
}

/* ---------- queue: one row, everything actionable inline ---------- */
function queueRowHtml(r){
  const age = ageInDays(r);
  const due = daysUntilDeadline(r);
  const showAmount = isFeeBearing(r);
  const isOpen = openRowIndex === String(r.sheetRow);
  const type = requestTypeOf(r) || "(no type)";

  // Urgent means the money is due soon (or already), not merely that the
  // request is old.
  const urgent = (due !== null && due <= 3) || (due === null && age !== null && age >= STALE_DAYS);

  let badge;
  if(due === null){
    badge = '<span class="qage' + (age !== null && age >= STALE_DAYS ? " old" : "") + '">'
          + (age === null ? "?" : age + "d old") + "</span>";
  } else if(due < 0){
    badge = '<span class="qage old">' + Math.abs(due) + "d overdue</span>";
  } else {
    badge = '<span class="qage' + (due <= 3 ? " old" : "") + '">due in ' + due + "d</span>";
  }

  // Would this request take them past what they have left?
  const remaining = showAmount ? remainingFor(r) : null;
  const asking = Number(defaultAmountFor(r)) || 0;
  const overBudget = remaining !== null && asking > 0 && asking > remaining;

  return '<div class="qrow' + (urgent ? " stale" : "") + '" data-idx="' + r.sheetRow + '">'
    + '<div class="qmain">'
    +   '<div class="qname">' + escapeHtml(r.name || "(no name)") + "</div>"
    +   '<div class="qmeta">' + escapeHtml(type) + " &middot; " + escapeHtml(r.counselor || "no counselor")
    +     (r.messageToStudent ? ' &middot; <span class="msg-hint">note sent</span>' : "")
    +     (overBudget
          ? ' &middot; <span class="over-budget">asking $' + asking.toFixed(2)
            + ", only $" + remaining.toFixed(2) + " left</span>"
          : (remaining !== null && showAmount ? ' &middot; $' + remaining.toFixed(2) + " left" : ""))
    +   "</div>"
    + "</div>"
    + badge
    + '<select class="fld-stage" title="Stage shown to the student">'
    +   STAGES.map(function(st){
          return '<option value="' + st + '"' + (r.stage === st ? " selected" : "") + ">" + st + "</option>";
        }).join("")
    + "</select>"
    + (showAmount
        ? '<input type="number" step="0.01" class="fld-amount" placeholder="Amount" value="' + escapeHtml(defaultAmountFor(r)) + '" />'
        : "")
    + '<button class="btn-done" data-sheetrow="' + r.sheetRow + '">Mark done</button>'
    + '<button class="qexpand" data-expand="' + r.sheetRow + '">' + (isOpen ? "Hide" : "Details") + "</button>"
    + (isOpen ? '<div class="qdetails">' + detailGridHtml(r) + messageFieldHtml(r) + "</div>" : "")
    + "</div>";
}

/** Roster-only seniors, respecting the counselor filter where we can. */
function visibleRosterOnly(){
  // The roster carries no counselor, so "only my students" can't scope it --
  // say so rather than silently showing everyone's.
  return mineOnly ? [] : rosterOnly;
}

function rosterRowHtml(p){
  const low = p.percent !== null && p.percent < 80;
  const att = p.percent === null ? "attendance not recorded"
            : p.percent + "% attendance" + (p.percent < 80 ? " — below 80%" : "");
  return '<div class="qrow roster">'
    + '<div class="qmain">'
    +   '<div class="qname">' + escapeHtml(p.name) + "</div>"
    +   '<div class="qmeta">No requests yet &middot; ' + escapeHtml(att)
    +     (p.remaining !== null ? " &middot; $" + p.remaining.toFixed(2) + " available" : "")
    +   "</div>"
    + "</div>"
    + '<span class="qage' + (low ? " old" : "") + '">' + (low ? "low attendance" : "roster") + "</span>"
    + "</div>";
}

function detailGridHtml(r){
  // Driven by RESPONSE_FIELDS, same as everything else. This was the last
  // survivor of the old positional COLUMN_ORDER/FIELD_LABELS design; because it
  // referenced names that no longer exist, opening Details threw and left the
  // whole list frozen -- which looked like several buttons being broken at once.
  let rows = "";
  RESPONSE_FIELDS.forEach(function(f){
    if(!f.label) return;
    const v = r[f.k];
    if(v === "" || v === null || v === undefined) return;
    rows += '<div class="dg-label">' + escapeHtml(f.label) + "</div>"
          + '<div class="dg-value">' + escapeHtml(v) + "</div>";
  });
  if(!rows) rows = '<div class="dg-value" style="grid-column:1/-1;color:var(--muted);">No extra detail was submitted with this request.</div>';
  return '<div class="detail-grid">' + rows + "</div>";
}

function messageFieldHtml(r){
  return '<div class="action-row">'
    + '<div class="action-field"><label>Message to student (they see this in their portal)</label>'
    +   '<input type="text" class="fld-message wide" placeholder="e.g. Waiting on your ACT login" value="' + escapeHtml(r.messageToStudent) + '" /></div>'
    + '<div class="action-field"><label>Internal notes (students never see this)</label>'
    +   '<input type="text" class="fld-notes" placeholder="e.g. 7/14/26 - JS" value="' + escapeHtml(r.notes) + '" /></div>'
    + '<button class="btn-save" data-sheetrow="' + r.sheetRow + '">Save</button>'
    + "</div>";
}

function wireQueue(container){
  container.querySelectorAll(".btn-done").forEach(function(btn){
    btn.addEventListener("click", function(){
      saveRow(btn.getAttribute("data-sheetrow"), { markFulfilled: true });
    });
  });
  container.querySelectorAll(".btn-save").forEach(function(btn){
    btn.addEventListener("click", function(){ saveRow(btn.getAttribute("data-sheetrow"), {}); });
  });
  container.querySelectorAll(".qexpand").forEach(function(btn){
    btn.addEventListener("click", function(){
      const id = btn.getAttribute("data-expand");
      openRowIndex = (openRowIndex === id) ? null : id;
      render();
    });
  });
}

/* ---------- full cards ---------- */
function wireCards(container){
  container.querySelectorAll(".req-card-head").forEach(function(head){
    head.addEventListener("click", function(){
      const card = head.closest(".req-card");
      const idx = card.getAttribute("data-idx");
      openRowIndex = (openRowIndex === idx) ? null : idx;
      render();
    });
  });
  container.querySelectorAll(".btn-save").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      saveRow(btn.getAttribute("data-sheetrow"), {});
    });
  });
  container.querySelectorAll(".req-card-body").forEach(function(body){
    body.addEventListener("click", function(e){ e.stopPropagation(); });
  });
}

function cardHtml(r){
  const idx = String(r.sheetRow);
  const isOpen = openRowIndex === idx;
  const type = requestTypeOf(r) || "(no type)";
  const feeAmount = isFeeBearing(r) ? defaultAmountFor(r) : "";

  return '<div class="req-card' + (r.fulfilled ? " fulfilled" : "") + (isOpen ? " open" : "") + '" data-idx="' + idx + '">'
    + '<div class="req-card-head">'
    +   '<span class="req-badge">' + escapeHtml(type) + "</span>"
    +   "<div><div class=\"rc-name\">" + escapeHtml(r.name || "(no name)") + "</div>"
    +   '<div class="rc-meta">' + escapeHtml(r.timestamp) + " &middot; " + escapeHtml(r.email)
    +     " &middot; Counselor: " + escapeHtml(r.counselor) + "</div></div>"
    +   '<span class="spacer"></span>'
    +   (r.fulfilled ? '<span class="fulfilled-pill">Fulfilled</span>'
                     : '<span class="req-badge">' + escapeHtml(r.stage) + "</span>")
    + "</div>"
    + '<div class="req-card-body">'
    +   detailGridHtml(r)
    +   '<div class="action-row">'
    +     '<div class="action-field"><label>Stage (student sees this)</label><select class="fld-stage">'
    +       STAGES.map(function(st){
              return '<option value="' + st + '"' + (r.stage === st ? " selected" : "") + ">" + st + "</option>";
            }).join("")
    +     "</select></div>"
    +     (isFeeBearing(r)
          ? '<div class="action-field"><label>Amount Paid ($)</label><input type="number" step="0.01" class="fld-amount" value="' + escapeHtml(feeAmount) + '" /></div>'
          : "")
    +     '<label class="checkbox-field"><input type="checkbox" class="fld-fulfilled" ' + (r.fulfilled ? "checked" : "") + " /> Fulfilled</label>"
    +   "</div>"
    +   messageFieldHtml(r)
    +   '<div class="save-note">' + (isFeeBearing(r) ? "Marking this fulfilled logs the amount to the fellow's Spending Log." : "") + "</div>"
    + "</div></div>";
}

/* ===================== EXPORT ===================== */
/**
 * One row per logged expense, with the fellow's context attached, so usage
 * rolls up by fellow, high school, counselor or fee type in a pivot. Dollars
 * come from the Spending Log (what was actually paid), not from the amount
 * typed on a request.
 */
function buildExportRows(){
  // Context (school, counselor) comes from each fellow's own request rows.
  const ctxByKey = {};
  responses.forEach(function(r){
    const keys = [String(r.email || "").toLowerCase(), nameKey(r.name)].filter(Boolean);
    keys.forEach(function(k){
      if(ctxByKey[k]) return;
      ctxByKey[k] = {
        highSchool: r.highSchool || r.capHighSchool || "",
        counselor: r.counselor || "",
        role: r.role || ""
      };
    });
  });

  const header = ["Fellow Name","Email","High School","Counselor","Fellow or Advisee",
                  "Starting Funds","Total Spent","Remaining","Payments Recorded"];
  const rows = [header];

  feeRows.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(f){
    const ctx = ctxByKey[f.email] || ctxByKey[nameKey(f.name)] || {};
    rows.push([f.name, f.email, ctx.highSchool || "", ctx.counselor || "", ctx.role || "",
               f.startingFunds, f.spent, f.remaining, f.usedTriplets]);
  });

  return rows;
}

function toCsv(rows){
  return rows.map(function(row){
    return row.map(function(cell){
      const v = String(cell == null ? "" : cell);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(",");
  }).join("\n");
}

function exportFundsUsage(){
  const rows = buildExportRows();
  if(rows.length < 2){ showToast("Nothing to export yet."); return; }
  const blob = new Blob([toCsv(rows)], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "bryc-senior-funds-usage-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Exported " + (rows.length - 1) + " rows.");
}

/* ===================== SAVE ===================== */
/**
 * Writes columns AX:BA (Fulfilled, Notes, Stage, Message to Student) for one
 * row, logs the spend if this is the moment a fee request became fulfilled,
 * and then emails the student if anything they'd care about changed.
 *
 * opts.markFulfilled is what the queue's "Mark done" button passes -- there's
 * no checkbox in that view, the button IS the checkbox.
 */
function saveRow(sheetRowStr, opts){
  opts = opts || {};
  const sheetRow = Number(sheetRowStr);
  const r = responses.find(function(x){ return x.sheetRow === sheetRow; });
  if(!r) return;

  const scope = document.querySelector('[data-idx="' + sheetRow + '"]');
  if(!scope) return;
  const pick = function(sel){ return scope.querySelector(sel); };

  const notesInput = pick(".fld-notes");
  const messageInput = pick(".fld-message");
  const fulfilledInput = pick(".fld-fulfilled");
  const amountInput = pick(".fld-amount");
  const stageSelect = pick(".fld-stage");

  const wasFulfilled = r.fulfilled;
  const nowFulfilled = opts.markFulfilled ? true : (fulfilledInput ? fulfilledInput.checked : r.fulfilled);
  const notes = notesInput ? notesInput.value : r.notes;
  const message = messageInput ? messageInput.value : r.messageToStudent;
  const amount = amountInput ? Number(amountInput.value) || 0 : 0;
  // Fulfilling always lands the student on the final stage.
  const stage = nowFulfilled ? "Complete" : (stageSelect ? stageSelect.value : r.stage);

  const range = trackingRange(sheetRow);
  if(!range){ showToast("Tracking columns are missing — reload the page so they get created."); return; }

  const btn = pick(".btn-done") || pick(".btn-save");
  const btnLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }

  const messageChanged = String(message).trim() !== String(r.messageToStudent).trim();
  const becameFulfilled = !wasFulfilled && nowFulfilled;

  sheetsUpdate(range, [[nowFulfilled ? "TRUE" : "FALSE", notes, stage, message]])
    .then(function(){
      // Record the payment on Fee Payment Balance the moment a fee request
      // becomes fulfilled -- this is what keeps the sheet and the portal in step.
      if(becameFulfilled && isFeeBearing(r) && amount > 0){
        return logPayment(r, amount, defaultDescriptionFor(r));
      }
      return null;
    })
    .then(function(feeRow){
      r.fulfilled = nowFulfilled;
      r.notes = notes;
      r.stage = stage;
      r.messageToStudent = message;

      // The sheet is written and any payment logged, so update the screen NOW.
      // Emailing the student is a JSONP round-trip that can take several
      // seconds; waiting on it before re-rendering made "Mark done" look like
      // it had done nothing at all.
      if(feeRow){
        showToast("Saved. Logged $" + amount.toFixed(2) + " to " + feeRow.name
          + " — $" + feeRow.remaining.toFixed(2) + " left.");
      } else {
        showToast("Saved.");
      }
      if(btn){ btn.disabled = false; btn.textContent = btnLabel; }
      renderFilterTabs();
      render();

      // Now send the email in the background and report only if it's worth
      // saying something about.
      let pending = null;
      if(becameFulfilled) pending = notifyStudent(sheetRow, "fulfilled");
      else if(messageChanged && String(message).trim()) pending = notifyStudent(sheetRow, "message");
      if(pending){
        pending.then(function(res){
          if(res && res.status === "ok") showToast("Student emailed.");
          else if(res && res.status) showToast("Saved, but the student email didn't send: " + (res.message || res.status));
        }).catch(function(){ /* already saved; a failed email isn't worth an alarm */ });
      }
    })
    .catch(function(err){
      if(btn){ btn.disabled = false; btn.textContent = btnLabel; }
      // The tracking columns already saved; only the payment leg failed.
      showToast(err.message);
      r.fulfilled = nowFulfilled; r.notes = notes; r.stage = stage; r.messageToStudent = message;
      render();
    });
}
